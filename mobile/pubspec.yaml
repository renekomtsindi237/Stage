name: microrecouv
description: MicroRecouv - Gestion & Recouvrement Intelligents
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  # HTTP & API
  dio: ^5.4.3
  flutter_secure_storage: ^9.0.0
  # State management
  provider: ^6.1.2
  # Navigation
  go_router: ^13.2.0
  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  # Utils
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  connectivity_plus: ^6.0.3
  image_picker: ^1.0.7
  file_picker: ^8.0.3
  geolocator: ^13.0.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  # Fonts Inter chargées dynamiquement via google_fonts (pas besoin de fichiers locaux)
  # Pour embarquer les fonts offline, placer les .ttf dans assets/fonts/ et décommenter ci-dessous
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
  #       - asset: assets/fonts/Inter-ExtraBold.ttf
  #         weight: 800
