# docker-compose.staging.yml — Environnement staging (VPS unique)
# Usage : cp .env.staging .env && docker compose -f docker-compose.staging.yml up -d
# PostgreSQL fourni par Supabase — aucun conteneur postgres local

services:

  redis:
    image: redis:7-alpine
    container_name: imf_staging_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-staging_redis_pass}
    volumes:
      - redis_staging_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-staging_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks: [imf_staging]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: imf_staging_backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: staging
      POSTGRES_HOST:          ${POSTGRES_HOST}
      POSTGRES_PORT:          ${POSTGRES_PORT:-5432}
      POSTGRES_DB:            ${POSTGRES_DB:-postgres}
      POSTGRES_USER:          ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD:      ${POSTGRES_PASSWORD}
      POSTGRES_SSL_MODE:      ${POSTGRES_SSL_MODE:-require}
      REDIS_HOST:             redis
      REDIS_PORT:             "6379"
      REDIS_PASSWORD:         ${REDIS_PASSWORD:-staging_redis_pass}
      JWT_SECRET:             ${JWT_SECRET}
      JWT_REFRESH_SECRET:     ${JWT_REFRESH_SECRET}
      SMTP_HOST:              ${SMTP_HOST}
      SMTP_PORT:              ${SMTP_PORT:-587}
      SMTP_USER:              ${SMTP_USER}
      SMTP_PASSWORD:          ${SMTP_PASSWORD}
      INTERNAL_API_KEY:       ${SPRING_API_KEY}
      FIREBASE_ENABLED:       "false"
    depends_on:
      redis:
        condition: service_healthy
    expose: ["8080"]
    networks: [imf_staging]

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        ENV: staging
    container_name: imf_staging_web
    restart: unless-stopped
    expose: ["80"]
    networks: [imf_staging]
    depends_on:
      - backend

  nginx:
    image: nginx:1.25-alpine
    container_name: imf_staging_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/staging/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - web
    networks: [imf_staging]

  airflow-init:
    image: apache/airflow:2.9.1-python3.11
    container_name: imf_staging_airflow_init
    environment:
      AIRFLOW__CORE__EXECUTOR:             LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-postgres}?sslmode=${POSTGRES_SSL_MODE:-require}
      AIRFLOW__CORE__FERNET_KEY:           ${AIRFLOW__CORE__FERNET_KEY}
    entrypoint: /bin/bash
    command:
      - -c
      - "airflow db migrate && airflow users create --username admin --password ${AIRFLOW_ADMIN_PASSWORD} --firstname IMF --lastname Admin --role Admin --email ${DSI_EMAIL}"
    networks: [imf_staging]
    restart: on-failure

  airflow-webserver:
    image: apache/airflow:2.9.1-python3.11
    container_name: imf_staging_airflow_web
    restart: unless-stopped
    command: webserver
    environment:
      AIRFLOW__CORE__EXECUTOR:             LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-postgres}?sslmode=${POSTGRES_SSL_MODE:-require}
      AIRFLOW__CORE__FERNET_KEY:           ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY:      ${AIRFLOW_SECRET_KEY}
      INTERNAL_API_KEY:                    ${SPRING_API_KEY}
      IMF_API_BASE_URL:                    http://backend:8080
      POSTGRES_SSL_MODE:                   ${POSTGRES_SSL_MODE:-require}
    volumes:
      - ./pipeline/dags:/opt/airflow/dags
      - ./pipeline/src:/opt/airflow/pipeline
      - airflow_staging_logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8090:8080"
    networks: [imf_staging]

  airflow-scheduler:
    image: apache/airflow:2.9.1-python3.11
    container_name: imf_staging_airflow_sched
    restart: unless-stopped
    command: scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR:             LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-postgres}?sslmode=${POSTGRES_SSL_MODE:-require}
      AIRFLOW__CORE__FERNET_KEY:           ${AIRFLOW__CORE__FERNET_KEY}
      INTERNAL_API_KEY:                    ${SPRING_API_KEY}
      IMF_API_BASE_URL:                    http://backend:8080
      POSTGRES_SSL_MODE:                   ${POSTGRES_SSL_MODE:-require}
    volumes:
      - ./pipeline/dags:/opt/airflow/dags
      - ./pipeline/src:/opt/airflow/pipeline
      - airflow_staging_logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks: [imf_staging]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.2
    container_name: imf_staging_mlflow
    restart: unless-stopped
    command: >
      mlflow server
      --backend-store-uri postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=${POSTGRES_SSL_MODE:-require}
      --artifacts-destination s3://imf-ml/mlflow/artifacts
      --host 0.0.0.0
      --port 5000
      --default-artifact-root s3://imf-ml/mlflow/artifacts
    environment:
      MLFLOW_S3_ENDPOINT_URL:    ${R2_ENDPOINT}
      AWS_ACCESS_KEY_ID:         ${R2_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY:     ${R2_SECRET_ACCESS_KEY}
      MLFLOW_S3_IGNORE_TLS:      "false"
    expose: ["5000"]
    networks: [imf_staging]

volumes:
  redis_staging_data:
  airflow_staging_logs:

networks:
  imf_staging:
    driver: bridge
