[package]
name = "microrecouv"
version = "1.0.0"
description = "MicroRecouv — client bureau pour les institutions de microfinance"
authors = ["KOMTSINDI Réné Alban"]
homepage = "https://imf.rene.it.com"
edition = "2021"

[lib]
name = "microrecouv_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
