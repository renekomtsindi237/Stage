<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>MicroRecouv</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="MicroRecouv — Gestion & Recouvrement Intelligent"
    />
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <meta
      http-equiv="Content-Security-Policy"
      content="script-src 'self'; object-src 'none'; base-uri 'self'"
    />
    <script src="assets/beacon-guard.js"></script>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.4s ease;
      }
      #splash.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      .splash__logo {
        width: 180px;
        height: auto;
        animation: splash-float 1.6s ease-in-out infinite;
      }
      .splash__dots {
        margin-top: 32px;
        display: flex;
        gap: 10px;
      }
      .splash__dots span {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #4f46e5;
        animation: splash-dot 1.2s ease-in-out infinite;
      }
      .splash__dots span:nth-child(2) {
        animation-delay: 0.2s;
        background: #7c3aed;
      }
      .splash__dots span:nth-child(3) {
        animation-delay: 0.4s;
        background: #4f46e5;
      }
      @keyframes splash-float {
        0%,
        100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-14px);
        }
      }
      @keyframes splash-dot {
        0%,
        80%,
        100% {
          transform: scale(0.6);
          opacity: 0.35;
        }
        40% {
          transform: scale(1.1);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <img src="assets/logo.png" alt="MicroRecouv" class="splash__logo" />
      <div class="splash__dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
    <app-root></app-root>
  </body>
</html>
