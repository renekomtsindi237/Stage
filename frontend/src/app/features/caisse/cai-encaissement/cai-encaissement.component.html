<div class="page-content" style="max-width: 640px">
  <div class="page-header">
    <h2>{{ "caisse.encaissement_title" | translate }}</h2>
  </div>

  <div class="card">
    <!-- Client -->
    <div class="form-group">
      <label>{{ "common.name" | translate }}</label>
      @if (!selectedClient()) {
        <div class="search-bar">
          <span class="material-icons-round">search</span>
          <input
            type="text"
            [placeholder]="'caisse.search_client_placeholder' | translate"
            (input)="search($any($event.target).value)"
          />
        </div>
        @if (searchResults().length) {
          <div class="client-results">
            @for (c of searchResults(); track c.idClient) {
              <div class="client-result" (click)="select(c)">
                <p class="font-semibold">{{ c.nomClient }}</p>
                <p class="text-sm text-muted">{{ c.idClient }}</p>
              </div>
            }
          </div>
        }
      } @else {
        <div class="client-selected">
          <span class="material-icons-round" style="color: var(--color-success)"
            >check_circle</span
          >
          <div class="flex-1">
            <p class="font-semibold">
              {{ selectedClient()!.nomClient }}
            </p>
            <p class="text-sm text-muted">{{ selectedClient()!.idClient }}</p>
          </div>
          <button
            class="btn btn-ghost btn-sm"
            (click)="selectedClient.set(null)"
          >
            {{ "collecte.change" | translate }}
          </button>
        </div>
      }
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <label>{{ "caisse.montant_fcfa" | translate }}</label>
        <input
          type="number"
          class="form-control"
          formControlName="montant"
          placeholder="0"
        />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>{{ "collecte.type_operation" | translate }}</label>
          <select class="form-control" formControlName="typeOperation">
            <option value="REMBOURSEMENT">
              {{ "collecte.remboursement" | translate }}
            </option>
            <option value="EPARGNE">
              {{ "collecte.epargne" | translate }}
            </option>
          </select>
        </div>
        <div class="form-group">
          <label>{{ "caisse.canal_paiement" | translate }}</label>
          <select class="form-control" formControlName="canal">
            <option value="ESPECES">
              {{ "caisse.canal_especes" | translate }}
            </option>
            <option value="MOBILE_MONEY">
              {{ "caisse.canal_mobile_money" | translate }}
            </option>
            <option value="VIREMENT">
              {{ "caisse.canal_virement" | translate }}
            </option>
            <option value="CHEQUE">
              {{ "caisse.canal_cheque" | translate }}
            </option>
          </select>
        </div>
      </div>

      <div style="display: flex; gap: 12px; margin-top: 8px">
        <button
          type="button"
          class="btn btn-ghost"
          routerLink="/caisse/dashboard"
        >
          {{ "common.cancel" | translate }}
        </button>
        <button
          type="submit"
          class="btn btn-primary"
          style="flex: 1; justify-content: center"
          [disabled]="loading() || !selectedClient()"
        >
          @if (loading()) {
            <span class="material-icons-round spin">refresh</span>
          } @else {
            {{ "caisse.save_encaissement" | translate }}
          }
        </button>
      </div>
    </form>
  </div>
</div>
