<div class="page-content">
  <div class="page-header">
    <h2>Dashboard Analyste</h2>
    <p class="text-muted text-sm">Scoring MCRS & surveillance du modèle ML</p>
  </div>

  <div class="stats-grid" style="margin-bottom: 24px">
    <app-stat-card
      label="Clients scorés"
      [value]="data()?.totalClients ?? 0"
      [loading]="loading()"
    />
    <app-stat-card
      label="Score moyen"
      [value]="data()?.scoresMoyen ?? 0"
      [isPercent]="true"
      [loading]="loading()"
    />
    <app-stat-card
      label="Alertes ouvertes"
      [value]="data()?.alertesOuvertes ?? 0"
      [loading]="loading()"
    />
    <app-stat-card
      label="PSI dérive ML"
      [value]="data()?.driftPsi ?? 0"
      [loading]="loading()"
    />
  </div>

  <div class="two-col">
    <!-- Distribution des scores -->
    <div class="card">
      <h4 style="margin-bottom: 16px">Distribution des scores MCRS</h4>
      @if (loading()) {
        <div class="skeleton" style="height: 200px"></div>
      } @else {
        <canvas
          baseChart
          [data]="barChartData"
          [options]="barChartOptions"
          type="bar"
        ></canvas>
      }
    </div>

    <!-- Alertes récentes -->
    <div class="card">
      <h4 style="margin-bottom: 16px">Alertes récentes</h4>
      @for (a of data()?.alertesRecentes ?? []; track a.id) {
        <div
          style="
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid var(--color-border);
          "
        >
          <app-alert-badge [severite]="a.severite" />
          <div style="flex: 1">
            <p class="text-sm font-semibold">{{ a.message }}</p>
            <p class="text-sm text-muted">{{ a.nomClient }}</p>
          </div>
        </div>
      }
    </div>
  </div>
</div>
