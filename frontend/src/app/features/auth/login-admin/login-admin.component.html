<div class="admin-shell">
  <div class="admin-logo-wrap">
    <img src="assets/logo.png" alt="MicroRecouv" class="admin-logo-img" width="240" height="130">
  </div>

  <div class="admin-card">
    <h2 class="admin-card__title">Administration</h2>
    <p class="admin-card__subtitle">Connexion réservée au Super Administrateur</p>

    @if (error()) {
      <div class="alert alert-danger">
        <span class="material-icons-round">error_outline</span>
        <span>{{ error() }}</span>
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <label for="email">Adresse email</label>
        <input id="email" type="email" class="form-control"
               formControlName="email" placeholder="admin@microrecouv.cm">
      </div>

      <div class="form-group">
        <label for="pwd">Mot de passe</label>
        <div class="input-group">
          <input id="pwd" [type]="showPwd() ? 'text' : 'password'"
                 class="form-control" formControlName="motDePasse">
          <span class="input-suffix material-icons-round" (click)="togglePwd()">
            {{ showPwd() ? 'visibility_off' : 'visibility' }}
          </span>
        </div>
      </div>

      <button type="submit" class="btn btn-primary admin-card__submit" [disabled]="loading()">
        @if (loading()) { <span class="material-icons-round spin">refresh</span> }
        @else { Se connecter }
      </button>
    </form>

    <div class="admin-card__back">
      <a routerLink="/login">← Retour connexion utilisateur</a>
    </div>
  </div>
</div>
