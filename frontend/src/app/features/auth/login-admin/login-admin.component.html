<div class="admin-shell">
  <!-- Logo -->
  <div class="admin-logo-wrap">
    <img src="assets/logo.png" alt="MicroRecouv" class="admin-logo-img" />
  </div>

  <div class="admin-card">
    <!-- Header -->
    <div class="admin-card__header">
      <span class="material-icons-round admin-card__shield"
        >admin_panel_settings</span
      >
      <h2 class="admin-card__title">{{ 'login_admin.title' | translate }}</h2>
      <p class="admin-card__subtitle">
        {{ 'login_admin.subtitle' | translate }}
      </p>
    </div>

    <!-- Error -->
    @if (error()) {
      <div class="admin-alert">
        <span class="material-icons-round">error_outline</span>
        <span>{{ error() }}</span>
      </div>
    }

    <!-- Formulaire email + mot de passe -->
    <form [formGroup]="form" (ngSubmit)="submit()" class="admin-form">
      <div class="form-group">
        <label for="email">{{ 'login_admin.email_label' | translate }}</label>
        <input
          id="email"
          type="email"
          class="form-control"
          formControlName="email"
          [placeholder]="'login_admin.email_placeholder' | translate"
          autocomplete="username"
        />
      </div>

      <div class="form-group">
        <label for="pwd">{{ 'login_admin.pwd_label' | translate }}</label>
        <div class="input-group">
          <input
            id="pwd"
            [type]="showPwd() ? 'text' : 'password'"
            class="form-control"
            formControlName="motDePasse"
            autocomplete="current-password"
          />
          <span class="input-suffix material-icons-round" (click)="togglePwd()">
            {{ showPwd() ? "visibility_off" : "visibility" }}
          </span>
        </div>
      </div>

      <button type="submit" class="btn-admin-submit" [disabled]="loading()">
        @if (loading()) {
          <span class="material-icons-round spin">refresh</span>
          {{ 'login_admin.submit_loading' | translate }}
        } @else {
          <span class="material-icons-round">lock_open</span>
          {{ 'login_admin.submit' | translate }}
        }
      </button>
    </form>

    <!-- Lien retour -->
    <div class="admin-card__back">
      <a routerLink="/login">{{ 'login_admin.back' | translate }}</a>
    </div>
  </div>

  <!-- Badge sécurité -->
  <div class="admin-security-badge">
    <span class="material-icons-round">https</span>
    {{ 'login_admin.security_badge' | translate }}
  </div>
</div>
