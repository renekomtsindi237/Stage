<div class="page-content">
  <div class="page-header">
    <h2>{{ 'dir_rapports.title' | translate }}</h2>
    <p class="text-muted text-sm">
      {{ 'dir_rapports.subtitle' | translate }}
    </p>
  </div>

  <div class="rapports-list">
    @for (r of rapports; track r.id) {
      <div class="card rapport-card">
        <span class="material-icons-round rapport-icon">description</span>
        <div class="rapport-card__info">
          <p class="font-semibold">{{ r.titre }}</p>
          <div
            style="
              display: flex;
              align-items: center;
              gap: 8px;
              margin-top: 4px;
            "
          >
            <span class="badge" [class]="typeClass(r.type)">{{ r.type }}</span>
            @if (r.dateDernier) {
              <span class="text-sm text-muted"
                >{{ 'dir_rapports.last' | translate }} {{ r.dateDernier | date: "dd/MM/yyyy" }}</span
              >
            }
          </div>
        </div>
        <button
          class="btn btn-primary"
          (click)="generate(r)"
          [disabled]="generating() === r.id"
        >
          <span class="material-icons-round">
            {{ generating() === r.id ? "hourglass_empty" : "download" }}
          </span>
          {{ generating() === r.id ? ('dir_rapports.generating' | translate) : ('dir_rapports.generate_btn' | translate) }}
        </button>
      </div>
    }
  </div>
</div>
