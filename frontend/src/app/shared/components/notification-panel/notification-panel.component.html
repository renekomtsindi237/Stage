<div class="notif-overlay" [@fadeOverlay] (click)="close()">
  <div class="notif-panel" [@slideIn] (click)="$event.stopPropagation()">
    <div class="notif-header">
      <div class="notif-header__left">
        <h3>Notifications</h3>
        @if (unreadCount > 0) {
          <span class="notif-count-badge">{{ unreadCount }}</span>
        }
      </div>
      <div style="display: flex; gap: 8px; align-items: center">
        @if (unreadCount > 0) {
          <button class="btn btn-ghost btn-sm" (click)="markAllRead()">
            <span class="material-icons-round" style="font-size: 15px"
              >done_all</span
            >
            Tout lire
          </button>
        }
        <button class="btn btn-ghost btn-sm icon-only" (click)="close()">
          <span class="material-icons-round">close</span>
        </button>
      </div>
    </div>

    <div class="notif-list">
      @for (n of notifications; track n.id) {
        <div class="notif-item" [class.unread]="!n.lu" (click)="markRead(n)">
          <div class="notif-icon" [style.color]="colorForType(n.type)">
            <span class="material-icons-round">{{ iconForType(n.type) }}</span>
          </div>
          <div class="notif-body">
            <p class="notif-title">{{ n.titre }}</p>
            <p class="notif-msg">{{ n.message }}</p>
            <p class="notif-time">{{ timeAgo(n.createdAt) }}</p>
          </div>
          @if (!n.lu) {
            <span class="unread-dot"></span>
          }
        </div>
      } @empty {
        <div class="notif-empty">
          <span class="material-icons-round">notifications_none</span>
          <p>Aucune notification</p>
        </div>
      }
    </div>
  </div>
</div>
