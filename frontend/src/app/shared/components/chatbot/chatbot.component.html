<button
  class="chat-fab"
  (click)="toggle()"
  [class.open]="open()"
  title="Assistant IA MicroRecouv"
>
  @if (open()) {
    <svg
      width="20"
      height="20"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
      viewBox="0 0 24 24"
    >
      <path d="M18 6L6 18M6 6l12 12" />
    </svg>
  } @else {
    <svg
      width="22"
      height="22"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" />
    </svg>
    @if (messages().length > 1) {
      <span class="chat-badge">{{ messages().length - 1 }}</span>
    }
  }
</button>

@if (open()) {
  <div class="chat-panel">
    <div class="chat-header">
      <div class="chat-header-info">
        <div class="chat-avatar-wrap">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="2" y="3" width="20" height="14" rx="2" />
            <path d="M8 21h8M12 17v4" />
            <circle cx="8.5" cy="10" r="1.5" fill="currentColor" />
            <circle cx="15.5" cy="10" r="1.5" fill="currentColor" />
            <path d="M9 13.5s1 1.5 3 1.5 3-1.5 3-1.5" />
          </svg>
        </div>
        <div>
          <div class="chat-title">Assistant MicroRecouv</div>
          <div class="chat-status">
            <span class="status-dot"></span>En ligne · IA Groq
          </div>
        </div>
      </div>
      <button
        class="btn-icon-header"
        (click)="clear()"
        title="Effacer la conversation"
      >
        <svg
          width="14"
          height="14"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          viewBox="0 0 24 24"
        >
          <polyline points="3 6 5 6 21 6" />
          <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6" />
        </svg>
      </button>
    </div>

    <div class="chat-messages">
      @for (msg of messages(); track msg.ts) {
        <div class="msg-row" [class.user-row]="msg.role === 'user'">
          @if (msg.role === "assistant") {
            <div class="msg-avatar">
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <rect x="2" y="3" width="20" height="14" rx="2" />
                <circle cx="8.5" cy="10" r="1.5" fill="currentColor" />
                <circle cx="15.5" cy="10" r="1.5" fill="currentColor" />
              </svg>
            </div>
          }
          <div class="msg-bubble" [class.user-bubble]="msg.role === 'user'">
            <div
              class="msg-content"
              [innerHTML]="msg.content | chatMarkdown"
            ></div>
            <div class="msg-time">{{ msg.ts | date: "HH:mm" }}</div>
          </div>
        </div>
      }
      @if (loading()) {
        <div class="msg-row">
          <div class="msg-avatar">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="2" y="3" width="20" height="14" rx="2" />
              <circle cx="8.5" cy="10" r="1.5" fill="currentColor" />
              <circle cx="15.5" cy="10" r="1.5" fill="currentColor" />
            </svg>
          </div>
          <div class="msg-bubble typing-bubble">
            <span></span><span></span><span></span>
          </div>
        </div>
      }
      <div #messagesEnd></div>
    </div>

    <div class="chat-input-area">
      <textarea
        class="chat-input"
        placeholder="Posez votre question…"
        rows="1"
        [ngModel]="input()"
        (ngModelChange)="input.set($event)"
        (keydown)="onKeydown($event)"
        [disabled]="loading()"
      >
      </textarea>
      <button
        class="chat-send"
        (click)="send()"
        [disabled]="!input().trim() || loading()"
        title="Envoyer"
      >
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
          <path d="M2 21l21-9L2 3v7l15 2-15 2z" />
        </svg>
      </button>
    </div>
  </div>
}
