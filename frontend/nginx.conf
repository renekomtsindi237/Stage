server {
    listen 80;
    server_name _;
    client_max_body_size 6m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Bloque Cloudflare Web Analytics (beacon.min.js) → TypeError startTime.
    add_header Content-Security-Policy "script-src 'self'; object-src 'none'; base-uri 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Content-Security-Policy "script-src 'self'; object-src 'none'; base-uri 'self'" always;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Content-Security-Policy "script-src 'self'; object-src 'none'; base-uri 'self'" always;
    }

    # Health check (CI/CD)
    location = /health {
        access_log off;
        return 200 "IMF-WEB-OK\n";
        add_header Content-Type text/plain;
    }

    # SSE — /api/v1/sse/stream (doit précéder /api/)
    location /api/v1/sse/ {
        proxy_pass         http://127.0.0.1:9200;
        proxy_http_version 1.1;
        proxy_set_header   Connection '';
        proxy_set_header   Host $host;
        proxy_set_header   X-Accel-Buffering no;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding on;
        gzip off;
        add_header Cache-Control "no-cache";
    }
    location /api/sse/ {
        proxy_pass         http://127.0.0.1:9200;
        proxy_http_version 1.1;
        proxy_set_header   Connection '';
        proxy_set_header   Host $host;
        proxy_set_header   X-Accel-Buffering no;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 86400s;
        gzip off;
    }

    # Proxy API REST → backend Spring Boot
    # En staging : port 9200 (surchargé par nginx-frontend-staging.conf)
    location /api/ {
        proxy_pass         http://127.0.0.1:9200;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 15s;
        proxy_read_timeout    90s;
        proxy_send_timeout    90s;
        client_max_body_size 6m;
    }
}
