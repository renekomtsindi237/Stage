# docker-compose.dev.yml — Environnement développement local
# Usage : docker compose -f docker-compose.dev.yml up -d
# Prérequis : cp .env.dev .env

x-kafka-env: &kafka-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  SCHEMA_REGISTRY_URL: http://schema-registry:8081

x-airflow-common: &airflow-common
  build:
    context: ./pipeline
    dockerfile: Dockerfile.airflow
  image: imf-airflow-ml:2.8.4
  env_file: .env
  environment:
    <<: *kafka-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    PYTHONPATH: /opt/airflow:/opt/airflow/pipeline/src
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB}
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    SPRING_BASE_URL: http://backend:8080
    SPRING_API_KEY: ${SPRING_API_KEY}
    DSI_EMAIL: ${DSI_EMAIL}
    SMTP_HOST: ${SMTP_HOST}
    SMTP_PORT: ${SMTP_PORT}
    SMTP_USER: ${SMTP_USER}
    SMTP_PASSWORD: ${SMTP_PASSWORD}
    # ML / MCRS
    MCRS_MODEL_DIR: /ml/models/mcrs
    MCRS_API_URL: http://ml-api:8090
    MCRS_PSI_THRESHOLD: "0.20"
    MCRS_BATCH_SIZE: "500"
    CBS_DOSSIER_ENTRANT: /data/cbs/incoming
    DBT_PROJECT_DIR: /opt/airflow/dbt_project
    DBT_PROFILES_DIR: /opt/airflow/dbt_project
    DBT_TARGET: dev
  volumes:
    - ./pipeline/dags:/opt/airflow/dags
    - ./pipeline:/opt/airflow/pipeline
    - ./pipeline/dbt_project:/opt/airflow/dbt_project
    - ./pipeline/logs:/opt/airflow/logs
    - ./data:/opt/airflow/data
    - ml_models_dev:/ml/models
  depends_on:
    postgres:
      condition: service_healthy

services:

  # ── PostgreSQL 15 ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: imf_postgres_dev
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./pipeline/sql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (cache KPI) ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: imf_redis_dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Spring Boot Backend ──────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ghcr.io/microrecouv/backend:latest
    container_name: imf_backend_dev
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *kafka-env
      SPRING_PROFILES_ACTIVE: dev
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: ${JWT_SECRET}
      SPRING_API_KEY: ${SPRING_API_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      FIREBASE_ENABLED: "false"
      # Spring Kafka (maps to @Value("${kafka.bootstrap-servers}"))
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SCHEMA_REGISTRY_URL: http://schema-registry:8081
    volumes:
      - backend_uploads:/uploads
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Angular Frontend (nginx, image buildée par make build-frontend) ─────
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ghcr.io/microrecouv/frontend:latest
    container_name: imf_web_dev
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend

  # ── Nginx reverse proxy ──────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: imf_nginx_dev
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/dev/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - web

  # ── Airflow init ─────────────────────────────────────────────────────────
  airflow-init:
    <<: *airflow-common
    container_name: imf_airflow_init_dev
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username ${AIRFLOW_ADMIN_USER:-admin} \
          --password ${AIRFLOW_ADMIN_PASSWORD:-admin} \
          --firstname IMF --lastname Admin \
          --role Admin --email ${DSI_EMAIL:-admin@imf.cm}
    restart: on-failure

  airflow-webserver:
    <<: *airflow-common
    container_name: imf_airflow_web_dev
    restart: unless-stopped
    ports:
      - "8089:8080"
    command: webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: imf_airflow_sched_dev
    restart: unless-stopped
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ── FastAPI ML Service (MCRS scoring) ───────────────────────────────────
  ml-api:
    build:
      context: ./pipeline
      dockerfile: Dockerfile.ml
    image: ghcr.io/microrecouv/ml-api:latest
    container_name: imf_ml_api_dev
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *kafka-env
      MCRS_MODEL_DIR: /ml/models/mcrs
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ml_models_dev:/ml/models
      - ./pipeline/src:/app/pipeline/src
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/model/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── dbt ─────────────────────────────────────────────────────────────────
  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.8.6
    container_name: imf_dbt_dev
    profiles: ["tools"]
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./pipeline/dbt_project:/usr/app/dbt
    working_dir: /usr/app/dbt
    depends_on:
      postgres:
        condition: service_healthy
    command: ["run"]

  # ── Adminer (UI DB dev) ──────────────────────────────────────────────────
  adminer:
    image: adminer:4
    container_name: imf_adminer_dev
    restart: unless-stopped
    ports:
      - "8888:8080"
    depends_on:
      - postgres

volumes:
  postgres_dev_data:
    driver: local
  backend_uploads:
    driver: local
  ml_models_dev:
    driver: local

networks:
  default:
    name: imf_dev_network
