# docker-compose.prod.yml — Production
# Déploiement sur 2 profils :
#   Pipeline server : docker compose -f docker-compose.prod.yml --profile pipeline up -d
#   App server      : docker compose -f docker-compose.prod.yml --profile app up -d
# PostgreSQL fourni par Supabase — aucun conteneur postgres local

services:

  # ─────────────────────────────────────────────────────────────
  # PIPELINE SERVER
  # ─────────────────────────────────────────────────────────────

  redis:
    profiles: [pipeline]
    image: redis:7-alpine
    container_name: imf_prod_redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    volumes:
      - redis_prod_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      retries: 3
    networks: [imf_prod_pipeline]

  airflow-webserver:
    profiles: [pipeline]
    image: apache/airflow:2.9.1-python3.11
    container_name: imf_prod_airflow_web
    restart: always
    command: webserver
    environment:
      AIRFLOW__CORE__EXECUTOR:             LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT:-5432}/${POSTGRES_DB}?sslmode=${POSTGRES_SSL_MODE:-require}
      AIRFLOW__CORE__FERNET_KEY:           ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY:      ${AIRFLOW_SECRET_KEY}
      AIRFLOW__WEBSERVER__BASE_URL:        https://airflow.microrecouv.cm
      INTERNAL_API_KEY:                    ${SPRING_API_KEY}
      IMF_API_BASE_URL:                    https://api.microrecouv.cm
      POSTGRES_SSL_MODE:                   ${POSTGRES_SSL_MODE:-require}
    volumes:
      - ./pipeline/dags:/opt/airflow/dags:ro
      - ./pipeline/src:/opt/airflow/pipeline:ro
      - airflow_prod_logs:/opt/airflow/logs
    expose: ["8080"]
    networks: [imf_prod_pipeline]

  airflow-scheduler:
    profiles: [pipeline]
    image: apache/airflow:2.9.1-python3.11
    container_name: imf_prod_airflow_sched
    restart: always
    command: scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR:             LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT:-5432}/${POSTGRES_DB}?sslmode=${POSTGRES_SSL_MODE:-require}
      AIRFLOW__CORE__FERNET_KEY:           ${AIRFLOW__CORE__FERNET_KEY}
      INTERNAL_API_KEY:                    ${SPRING_API_KEY}
      IMF_API_BASE_URL:                    https://api.microrecouv.cm
      POSTGRES_SSL_MODE:                   ${POSTGRES_SSL_MODE:-require}
    volumes:
      - ./pipeline/dags:/opt/airflow/dags:ro
      - ./pipeline/src:/opt/airflow/pipeline:ro
      - airflow_prod_logs:/opt/airflow/logs
    networks: [imf_prod_pipeline]

  # ─────────────────────────────────────────────────────────────
  # APP SERVER
  # ─────────────────────────────────────────────────────────────

  backend:
    profiles: [app]
    image: ${DOCKER_REGISTRY:-ghcr.io}/microrecouv/backend:${IMAGE_TAG:-latest}
    container_name: imf_prod_backend
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_HOST:          ${POSTGRES_HOST}
      POSTGRES_PORT:          ${POSTGRES_PORT:-5432}
      POSTGRES_DB:            ${POSTGRES_DB}
      POSTGRES_USER:          ${POSTGRES_USER}
      POSTGRES_PASSWORD:      ${POSTGRES_PASSWORD}
      POSTGRES_SSL_MODE:      ${POSTGRES_SSL_MODE:-require}
      REDIS_HOST:             ${REDIS_HOST}
      REDIS_PORT:             ${REDIS_PORT:-6379}
      REDIS_PASSWORD:         ${REDIS_PASSWORD}
      JWT_SECRET:             ${JWT_SECRET}
      JWT_REFRESH_SECRET:     ${JWT_REFRESH_SECRET}
      SMTP_HOST:              ${SMTP_HOST}
      SMTP_PORT:              ${SMTP_PORT:-587}
      SMTP_USER:              ${SMTP_USER}
      SMTP_PASSWORD:          ${SMTP_PASSWORD}
      INTERNAL_API_KEY:       ${SPRING_API_KEY}
      GROQ_API_KEY:           ${GROQ_API_KEY}
      FIREBASE_ENABLED:       "true"
      FIREBASE_CREDENTIALS_PATH: /run/secrets/firebase_creds
    secrets:
      - firebase_creds
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
      restart_policy:
        condition: on-failure
        max_attempts: 3
    expose: ["8080"]
    volumes:
      - backend_prod_uploads:/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks: [imf_prod_app]

  web:
    profiles: [app]
    image: ${DOCKER_REGISTRY:-ghcr.io}/microrecouv/web:${IMAGE_TAG:-latest}
    container_name: imf_prod_web
    restart: always
    expose: ["80"]
    networks: [imf_prod_app]

  nginx:
    profiles: [app]
    image: nginx:1.25-alpine
    container_name: imf_prod_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/prod/certs:/etc/nginx/certs:ro
      - nginx_prod_logs:/var/log/nginx
    depends_on:
      - backend
      - web
    networks: [imf_prod_app]

secrets:
  firebase_creds:
    file: ${FIREBASE_CREDENTIALS_PATH:-./secrets/firebase-credentials.json}

volumes:
  redis_prod_data:
  airflow_prod_logs:
  nginx_prod_logs:
  backend_prod_uploads:

networks:
  imf_prod_pipeline:
    driver: bridge
  imf_prod_app:
    driver: bridge
