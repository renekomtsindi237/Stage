# docker-compose.analytics.yml — Couche analytics : Apache Spark + Apache Flink
# Usage : docker compose -f docker-compose.dev.yml \
#                        -f docker-compose.streaming.yml \
#                        -f docker-compose.analytics.yml up -d
#
# Apache Spark 3.5 (standalone) — batch feature engineering + ML training
# Apache Flink 1.19 (standalone) — stream processing KPI temps-réel depuis Kafka

services:

  # ══════════════════════════════════════════════════════════════════════════
  # APACHE SPARK 3.5 (mode standalone)
  # ══════════════════════════════════════════════════════════════════════════

  # ── Spark Master ──────────────────────────────────────────────────────────
  spark-master:
    image: bitnami/spark:3.5
    container_name: imf_spark_master
    hostname: spark-master
    restart: unless-stopped
    ports:
      - "8083:8080"    # Spark Web UI
      - "7077:7077"    # Spark Master RPC
    environment:
      SPARK_MODE: master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
      SPARK_MASTER_OPTS: >-
        -Dspark.deploy.defaultCores=2
        -Dspark.executor.memory=1g
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
    volumes:
      - ./pipeline/spark:/opt/spark-jobs:ro
      - ./data:/opt/spark-data:ro
      - spark_logs:/opt/bitnami/spark/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Spark Worker 1 ────────────────────────────────────────────────────────
  spark-worker-1:
    image: bitnami/spark:3.5
    container_name: imf_spark_worker_1
    hostname: spark-worker-1
    restart: unless-stopped
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 1G
      SPARK_WORKER_CORES: 2
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
    volumes:
      - ./pipeline/spark:/opt/spark-jobs:ro
      - ./data:/opt/spark-data:ro
      - spark_worker1_data:/opt/bitnami/spark/work
    depends_on:
      spark-master:
        condition: service_healthy

  # ── Spark Worker 2 ────────────────────────────────────────────────────────
  spark-worker-2:
    image: bitnami/spark:3.5
    container_name: imf_spark_worker_2
    hostname: spark-worker-2
    restart: unless-stopped
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 1G
      SPARK_WORKER_CORES: 2
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
    volumes:
      - ./pipeline/spark:/opt/spark-jobs:ro
      - ./data:/opt/spark-data:ro
      - spark_worker2_data:/opt/bitnami/spark/work
    depends_on:
      spark-master:
        condition: service_healthy

  # ── Spark History Server (audit des jobs) ─────────────────────────────────
  spark-history:
    image: bitnami/spark:3.5
    container_name: imf_spark_history
    restart: unless-stopped
    ports:
      - "18080:18080"
    environment:
      SPARK_MODE: master
    volumes:
      - spark_logs:/opt/bitnami/spark/logs:ro
    command: /opt/bitnami/spark/sbin/start-history-server.sh
    depends_on:
      - spark-master

  # ══════════════════════════════════════════════════════════════════════════
  # APACHE FLINK 1.19 (mode standalone)
  # ══════════════════════════════════════════════════════════════════════════

  # ── Flink JobManager ──────────────────────────────────────────────────────
  flink-jobmanager:
    image: flink:1.19-scala_2.12-java17
    container_name: imf_flink_jobmanager
    hostname: flink-jobmanager
    restart: unless-stopped
    ports:
      - "8084:8081"    # Flink Web UI
      - "6123:6123"    # JobManager RPC
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.rpc.port: 6123
        jobmanager.memory.process.size: 1600m
        taskmanager.memory.process.size: 1728m
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 2
        state.backend: filesystem
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.savepoints.dir: file:///opt/flink/savepoints
        execution.checkpointing.interval: 60000
        execution.checkpointing.mode: EXACTLY_ONCE
        # Kafka config (référence les variables du streaming compose)
        kafka.bootstrap.servers: kafka:9092
        kafka.schema.registry.url: http://schema-registry:8081
    volumes:
      - ./pipeline/flink:/opt/flink-jobs:ro
      - flink_checkpoints:/opt/flink/checkpoints
      - flink_savepoints:/opt/flink/savepoints
      - flink_logs:/opt/flink/log
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/overview"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Flink TaskManager ─────────────────────────────────────────────────────
  flink-taskmanager:
    image: flink:1.19-scala_2.12-java17
    container_name: imf_flink_taskmanager
    hostname: flink-taskmanager
    restart: unless-stopped
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.rpc.port: 6123
        taskmanager.memory.process.size: 1728m
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 2
        state.backend: filesystem
        state.checkpoints.dir: file:///opt/flink/checkpoints
    volumes:
      - ./pipeline/flink:/opt/flink-jobs:ro
      - flink_checkpoints:/opt/flink/checkpoints
      - flink_tm_data:/opt/flink/work
    depends_on:
      flink-jobmanager:
        condition: service_healthy

  # ── Flink Job Submitter (soumet les jobs PyFlink au démarrage) ────────────
  flink-job-submitter:
    image: flink:1.19-scala_2.12-java17
    container_name: imf_flink_submitter
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    volumes:
      - ./pipeline/flink:/opt/flink-jobs:ro
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      echo 'Attente Flink JobManager...'
      sleep 15

      echo 'Soumission du job KPI temps-reel...'
      flink run -m flink-jobmanager:8081 \
        -py /opt/flink-jobs/kpi_realtime_job.py \
        -d || echo 'Job KPI: echec (Kafka peut-etre pas pret)'

      echo 'Soumission du job alertes MCRS...'
      flink run -m flink-jobmanager:8081 \
        -py /opt/flink-jobs/alerte_mcrs_stream_job.py \
        -d || echo 'Job alertes: echec (Kafka peut-etre pas pret)'

      echo 'Jobs soumis.'
      "
    restart: on-failure

volumes:
  spark_logs:
    driver: local
  spark_worker1_data:
    driver: local
  spark_worker2_data:
    driver: local
  flink_checkpoints:
    driver: local
  flink_savepoints:
    driver: local
  flink_logs:
    driver: local
  flink_tm_data:
    driver: local

networks:
  default:
    name: imf_dev_network
    external: true
