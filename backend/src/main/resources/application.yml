spring:
  application:
    name: imf-pipeline-backend

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:imf_db}?sslmode=${POSTGRES_SSL_MODE:disable}
    username: ${POSTGRES_USER:imf_user}
    password: ${POSTGRES_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      data-source-properties:
        ssl: ${POSTGRES_SSL_ENABLED:false}
        sslmode: ${POSTGRES_SSL_MODE:disable}

  jpa:
    hibernate:
      ddl-auto: none            # Flyway gère le schéma
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: app

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: app
    out-of-order: true
    repair-on-migrate: true   # nettoie les migrations FAILED avant de relancer (PgBouncer safe)

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:noreply@imf.cm}
    password: ${SMTP_PASSWORD:changeme}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# JWT
jwt:
  secret: ${JWT_SECRET:imf_jwt_secret_key_change_in_production_minimum_256_bits}
  access-token-expiry-ms: 3600000       # 1 heure
  refresh-token-expiry-ms: 604800000    # 7 jours

# Firebase
firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:/run/secrets/firebase-credentials.json}
  enabled: ${FIREBASE_ENABLED:true}

# Spring Boot API interne (pour pipeline Python)
internal:
  api-key: ${SPRING_API_KEY:changeme_internal_api_key}

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    filter: true
    disable-swagger-default-url: true
    default-models-expand-depth: 1
    persist-authorization: true
    urls-primary-name: auth    # groupe pré-sélectionné au chargement
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  show-actuator: false
  group-configs:
    - group: auth
      display-name: "Authentification & OTP"
      paths-to-match: /api/v1/auth/**
    - group: clients
      display-name: "Clients & KYC"
      paths-to-match: /api/v1/clients/**, /api/v1/kyc/**
    - group: collectes
      display-name: "Collectes & Crédit"
      paths-to-match: /api/v1/collectes/**, /api/v1/collectes-epargne/**, /api/v1/prets/**
    - group: recouvrement
      display-name: "Recouvrement & Créances"
      paths-to-match: /api/v1/recouvrement/**, /api/v1/creances/**, /api/v1/admin/violations/**, /api/v1/echeances/**, /api/v1/dossiers/**
    - group: scoring
      display-name: "Scoring ML (MCRS)"
      paths-to-match: /api/v1/ml/**
    - group: admin
      display-name: "Administration & Reporting"
      paths-to-match: /api/v1/admin/**, /api/v1/reporting/**, /api/v1/platform/**, /api/v1/users/**, /api/v1/agents/**, /api/v1/kpi/**, /api/v1/lang/**, /api/v1/alertes/**, /api/v1/notifications/**, /api/v1/sync/**, /api/v1/sse/**
    - group: rgpd
      display-name: "Conformité RGPD"
      paths-to-match: /api/v1/mes-donnees/**, /api/v1/admin/rgpd/**

# Cache KPI
imf:
  swagger:
    server-url: ${IMF_SWAGGER_SERVER_URL:http://localhost:9090}
  app:
    name: ${APP_NAME:IMF Pipeline}
    url: ${APP_URL:http://localhost:4200}
  mail:
    from-name: ${SMTP_FROM_NAME:MicroRecouv}
    from: ${SMTP_FROM:${SMTP_USER:noreply@imf.cm}}
    reply-to: ${SMTP_REPLY_TO:}
  cache:
    kpi-ttl-seconds: 3600     # 1h
  pipeline:
    dw-schema: dw
    staging-schema: staging
    ml-api-url: ${ML_API_URL:http://ml-api:8090}
    ml-api-timeout-seconds: ${ML_API_TIMEOUT_SECONDS:5}
  ai:
    api-key: ${GROQ_API_KEY:}
    base-url: https://api.groq.com/openai/v1
    model: llama-3.3-70b-versatile
    max-tokens: 2048

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

app:
  api:
    encryption-key: ${API_ENCRYPTION_KEY:microrecouv_api_enc_key_change_in_prod_32c}
  security:
    cookie-secure: false   # true en prod (application-prod.yml)
    rate-limit:
      max-attempts: 5      # tentatives max par IP sur la fenêtre glissante
      window-seconds: 60   # durée de la fenêtre (secondes)
  upload:
    dir: ${UPLOAD_DIR:/uploads}
    max-size-mb: 5
  r2:
    enabled: ${R2_ENABLED:false}
    endpoint: ${R2_ENDPOINT:}
    bucket: ${R2_BUCKET:imf-ml}
    access-key: ${R2_ACCESS_KEY_ID:}
    secret-key: ${R2_SECRET_ACCESS_KEY:}
    logo-prefix: imf-logos
    public-url-base: ${R2_PUBLIC_URL:}

# Kafka / Avro
kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9093}
  schema-registry-url: ${KAFKA_SCHEMA_REGISTRY_URL:http://localhost:8081}
  consumer:
    group-id: ${KAFKA_CONSUMER_GROUP_ID:imf-backend-spring}

management:
  health:
    mail:
      enabled: false  # pas de serveur SMTP en dev
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    cm.imf: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.apache.kafka: WARN

