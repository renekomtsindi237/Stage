spring:
  datasource:
    # Supabase PostgreSQL — transaction pooler (PgBouncer)
    # prepareThreshold=0 désactive les prepared statements serveur (incompatibles avec le pooler)
    url: jdbc:postgresql://aws-0-eu-west-3.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
    username: ${SUPABASE_DB_USER:postgres.ceiqkvvacjsakycsgcfz}
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
      connection-timeout: 30000
      data-source-properties:
        prepareThreshold: 0
        ssl: true
        sslmode: require

  jpa:
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

logging:
  level:
    cm.imf: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{requestId}] %-5level %logger{36} - %msg%n"

imf:
  mail:
    from-name: ${SMTP_FROM_NAME:MicroRecouv}
    from: ${SMTP_FROM:${SMTP_USER:}}
    reply-to: ${SMTP_REPLY_TO:}
  pipeline:
    firebase-enabled: ${FIREBASE_ENABLED:false}
    internal-api-key: ${INTERNAL_API_KEY:changeme}
    dw-schema: ${DW_SCHEMA:dw}
    staging-schema: ${STAGING_SCHEMA:staging}
    scheduler:
      token-cleanup-ms: 3600000
      cache-evict-cron: "0 0 2 * * *"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
