#Pipeline CI/CD qui s'effectuera sur un runner vers le serveur VPS directement 

name: CI/CD — IMF Pipeline

# ──────────────────────────────────────────────────────────────────────────────
# Stratégie :
#   push dev/staging/main  → CI complet (qualité + tests)
#   push main/staging      → CI + Build 4 images Docker + Bootstrap VPS + Deploy
#   workflow_dispatch      → CI + deploy staging OU production selon inputs
#   pull_request           → CI uniquement (pas de deploy)
#
# Images Docker (GHCR) :
#   imf-backend   → backend/Dockerfile       (Spring Boot / Java 17)
#   imf-ml-api    → pipeline/Dockerfile.ml   (FastAPI ML scoring)
#   imf-airflow   → pipeline/Dockerfile.airflow (Airflow 2.8 + DAGs)
#   imf-frontend  → frontend/Dockerfile       (Angular 17 / nginx)
#
# Fichiers de déploiement (versionnés dans le repo) :
#   deploy/docker-compose.backend-pipeline.yml  ← backend + pipeline + nginx-api
#   deploy/docker-compose.frontend.yml           ← frontend Angular
#   deploy/nginx/nginx-api-staging.conf          ← port 9090 (API gateway)
#   deploy/nginx/nginx-frontend-staging.conf     ← port 9091 (Angular SPA)
#
# Secrets GitHub requis :
#   STAGING_HOST, STAGING_USER, STAGING_SSH_KEY, STAGING_PORT
#   STAGING_SUPABASE_DB_PASSWORD   — mot de passe Supabase PostgreSQL
#   STAGING_SUPABASE_ANON_KEY      — clé anon Supabase (publishable)
#   STAGING_AIRFLOW_DB_PASSWORD    — mot de passe PostgreSQL local Airflow
#   STAGING_JWT_SECRET             — secret JWT Spring Boot + Airflow
#   STAGING_AIRFLOW_FERNET_KEY     — clé Fernet Airflow (base64url 32 octets)
#   STAGING_AIRFLOW_ADMIN_PASSWORD — mot de passe UI Airflow
#   PROD_HOST, PROD_USER, PROD_SSH_KEY
#   PROD_SUPABASE_DB_PASSWORD, PROD_SUPABASE_ANON_KEY, PROD_AIRFLOW_DB_PASSWORD
#   PROD_JWT_SECRET, PROD_AIRFLOW_FERNET_KEY, PROD_AIRFLOW_ADMIN_PASSWORD
#
# Variables GitHub requises :
#   STAGING_URL      ex : http://84.247.128.40:9090  (API gateway)
#   STAGING_WEB_URL  ex : http://84.247.128.40:9091  (Frontend web)
#   PRODUCTION_URL      ex : https://api.imf.votredomaine.com
#   PRODUCTION_WEB_URL  ex : https://app.imf.votredomaine.com
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]
  workflow_dispatch:
    inputs:
      deploy_env:
        description: "Environnement de déploiement"
        required: false
        default: staging
        type: choice
        options: [staging, production]
      confirm_prod:
        description: "Production uniquement : taper exactement 'DEPLOY' pour confirmer"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: imf-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY:        ghcr.io
  JAVA_VERSION:    "21"
  PYTHON_VERSION:  "3.11"
  NODE_VERSION:    "24"
  BACKEND_IMAGE:   ${{ github.repository }}/imf-backend
  ML_API_IMAGE:    ${{ github.repository }}/imf-ml-api
  AIRFLOW_IMAGE:   ${{ github.repository }}/imf-airflow
  FRONTEND_IMAGE:  ${{ github.repository }}/imf-frontend
  SPRING_PROFILES_ACTIVE: test
  APP_ENV:         testing

jobs:

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 1 — Backend CI  (Spring Boot / Java 17 / Maven)
  # ════════════════════════════════════════════════════════════════════════════
  backend-ci:
    name: "Backend CI (Java 17 / Maven)"
    runs-on: self-hosted
    defaults:
      run:
        working-directory: backend/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Compile
        run: mvn -B compile -Dmaven.test.skip=true

      - name: Tests (JUnit)
        run: mvn -B test
        env:
          SPRING_PROFILES_ACTIVE: test

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: junit-backend-${{ github.sha }}
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 2 — Pipeline CI  (Python 3.11 / black / flake8 / pytest)
  # ════════════════════════════════════════════════════════════════════════════
  pipeline-ci:
    name: "Pipeline CI (Python 3.11)"
    runs-on: self-hosted
    defaults:
      run:
        working-directory: pipeline/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linters
        run: pip install black flake8 isort bandit

      - name: Black
        run: black --check --diff src/ dags/

      - name: isort
        run: isort --check-only --diff src/ dags/

      - name: Flake8
        run: flake8 src/ dags/ --max-line-length 120 --exclude dbt_project/

      - name: Bandit
        run: bandit -r src/ --severity-level medium --confidence-level medium
        continue-on-error: true

      - name: Tests (pytest)
        run: |
          if [ -d tests ]; then
            pip install -r requirements-ci.txt
            pytest tests/ -v --tb=short --junitxml=../junit-pipeline.xml
          else
            echo "Aucun dossier tests/ — étape ignorée"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: junit-pipeline-${{ github.sha }}
          path: junit-pipeline.xml
          if-no-files-found: ignore

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 3 — Frontend CI  (Angular 17 / Node 20)
  # ════════════════════════════════════════════════════════════════════════════
  frontend-ci:
    name: "Frontend CI (Angular 18 / Node 22)"
    runs-on: self-hosted
    defaults:
      run:
        working-directory: frontend/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Free disk space
        run: |
          df -h .
          # Nettoie le cache npm accumulé par les runs précédents
          npm cache clean --force 2>/dev/null || true
          # Supprime node_modules laissé par un run précédent (workspace réutilisé)
          rm -rf node_modules 2>/dev/null || true
          # Purge les images Docker inutilisées (dangling only — rapide et sûr)
          docker image prune -f 2>/dev/null || true
          df -h .

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --prefer-offline 2>/dev/null || npm ci --legacy-peer-deps

      - name: Prettier check
        run: npx prettier --check "src/**/*.{ts,html,scss}"

      - name: TypeScript check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Build production
        run: npm run build -- --configuration production

  # ════════════════════════════════════════════════════════════════════════════
  # JOBs 4-7 — Build & Push images Docker  (main/staging push + dispatch)
  # ════════════════════════════════════════════════════════════════════════════
  build-backend:
    name: "Build & Push imf-backend (GHCR)"
    needs: [backend-ci, pipeline-ci, frontend-ci]
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'))
      || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker tags
        id: meta
        uses: ./.github/actions/docker-tags
        with:
          image: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-ml-api:
    name: "Build & Push imf-ml-api (GHCR)"
    needs: [backend-ci, pipeline-ci, frontend-ci]
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'))
      || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker tags
        id: meta
        uses: ./.github/actions/docker-tags
        with:
          image: ${{ env.REGISTRY }}/${{ env.ML_API_IMAGE }}
      - uses: docker/build-push-action@v5
        with:
          context: ./pipeline
          file: ./pipeline/Dockerfile.ml
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-airflow:
    name: "Build & Push imf-airflow (GHCR)"
    needs: [backend-ci, pipeline-ci, frontend-ci]
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'))
      || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker tags
        id: meta
        uses: ./.github/actions/docker-tags
        with:
          image: ${{ env.REGISTRY }}/${{ env.AIRFLOW_IMAGE }}
      - uses: docker/build-push-action@v5
        with:
          context: ./pipeline
          file: ./pipeline/Dockerfile.airflow
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: "Build & Push imf-frontend (GHCR)"
    needs: [backend-ci, pipeline-ci, frontend-ci]
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'))
      || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker tags
        id: meta
        uses: ./.github/actions/docker-tags
        with:
          image: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}
      - uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 8 — Bootstrap VPS Staging
  # Installe Docker + Compose + IPv6 + répertoires
  # ════════════════════════════════════════════════════════════════════════════
  bootstrap-staging:
    name: "Bootstrap VPS Staging"
    needs: [backend-ci, pipeline-ci, frontend-ci]
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'))
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_env != 'production')
    runs-on: self-hosted
    steps:
      - name: Mask secrets
        run: |
          echo "::add-mask::${{ secrets.STAGING_HOST }}"
          echo "::add-mask::${{ secrets.STAGING_SSH_KEY }}"
          echo "::add-mask::${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}"
          echo "::add-mask::${{ secrets.STAGING_SUPABASE_ANON_KEY }}"
          echo "::add-mask::${{ secrets.STAGING_AIRFLOW_DB_PASSWORD }}"
          echo "::add-mask::${{ secrets.STAGING_JWT_SECRET }}"
          echo "::add-mask::${{ secrets.STAGING_AIRFLOW_FERNET_KEY }}"
          echo "::add-mask::${{ secrets.STAGING_AIRFLOW_ADMIN_PASSWORD }}"

      - name: Bootstrap Docker + Compose + IPv6 + répertoires
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key:      ${{ secrets.STAGING_SSH_KEY }}
          port:     ${{ secrets.STAGING_PORT }}
          script: |
            set -euo pipefail

            # ── Docker ──────────────────────────────────────────────────────
            if ! command -v docker &>/dev/null; then
              curl -fsSL https://get.docker.com | sh
              usermod -aG docker "$USER"
              systemctl enable --now docker
              echo "==> Docker installé : $(docker --version)"
            else
              echo "==> Docker OK : $(docker --version)"
            fi

            # ── Docker Compose plugin ────────────────────────────────────────
            if ! docker compose version &>/dev/null 2>&1; then
              mkdir -p /usr/local/lib/docker/cli-plugins
              COMPOSE_URL="https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)"
              curl -SL "$COMPOSE_URL" -o /usr/local/lib/docker/cli-plugins/docker-compose
              chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
              echo "==> Compose installé : $(docker compose version)"
            else
              echo "==> Compose OK : $(docker compose version)"
            fi

            # ── IPv6 daemon.json (sans redémarrage — le runner et le VPS sont la même machine)
            # Redémarrer Docker ici tuerait le conteneur appleboy/ssh-action en cours d'exécution.
            DAEMON_JSON="/etc/docker/daemon.json"
            if [ ! -f "$DAEMON_JSON" ]; then
              echo '{"ipv6":true,"fixed-cidr-v6":"fd00::/80","ip6tables":true}' > "$DAEMON_JSON"
              echo "==> daemon.json créé (redémarrage Docker à faire hors CI)"
            else
              echo "==> daemon.json OK"
            fi
            ip6tables -t mangle -C POSTROUTING -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --set-mss 1280 2>/dev/null || \
              ip6tables -t mangle -A POSTROUTING -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --set-mss 1280 2>/dev/null || true
            ip6tables -C OUTPUT -p tcp -d 2606:50c0::/32 --dport 443 -j REJECT 2>/dev/null || \
              ip6tables -I OUTPUT -p tcp -d 2606:50c0::/32 --dport 443 -j REJECT --reject-with tcp-reset 2>/dev/null || true
            echo "==> IPv6/ip6tables OK"

            # ── Répertoires IMF ──────────────────────────────────────────────
            mkdir -p /opt/imf-pipeline/{backups,logs}
            mkdir -p /ml/models/mcrs/{champion,challenger,archive}
            echo "==> Répertoires OK"

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 9 — Deploy Backend + Pipeline → Staging  (port 9090)
  # ════════════════════════════════════════════════════════════════════════════
  deploy-backend-staging:
    name: "Deploy Backend + Pipeline → Staging (:9090)"
    needs: [bootstrap-staging, build-backend, build-ml-api, build-airflow]
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'))
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_env != 'production')
    runs-on: self-hosted
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    outputs:
      deployed: ${{ steps.deploy.outcome }}

    steps:
      - name: Mask secrets
        run: |
          echo "::add-mask::${{ secrets.STAGING_HOST }}"
          echo "::add-mask::${{ secrets.STAGING_SSH_KEY }}"
          echo "::add-mask::${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}"
          echo "::add-mask::${{ secrets.STAGING_SUPABASE_ANON_KEY }}"
          echo "::add-mask::${{ secrets.STAGING_AIRFLOW_DB_PASSWORD }}"
          echo "::add-mask::${{ secrets.STAGING_JWT_SECRET }}"
          echo "::add-mask::${{ secrets.STAGING_AIRFLOW_FERNET_KEY }}"
          echo "::add-mask::${{ secrets.STAGING_AIRFLOW_ADMIN_PASSWORD }}"

      - name: Short SHA
        id: short_sha
        run: echo "sha=$(printf '%.7s' '${{ github.sha }}')" >> $GITHUB_OUTPUT

      - name: Lowercase GHCR base
        run: echo "GHCR_BASE=$(echo '${{ env.REGISTRY }}/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Deploy backend + pipeline (staging)
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USERNAME:          ${{ github.actor }}
          GHCR_READ_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
          GHCR_BASE:              ${{ env.GHCR_BASE }}
          SHA:                    ${{ steps.short_sha.outputs.sha }}
          SUPABASE_DB_PASSWORD:   ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          SUPABASE_ANON_KEY:      ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          AIRFLOW_DB_PASSWORD:    ${{ secrets.STAGING_AIRFLOW_DB_PASSWORD }}
          JWT_SECRET:             ${{ secrets.STAGING_JWT_SECRET }}
          AIRFLOW_FERNET_KEY:     ${{ secrets.STAGING_AIRFLOW_FERNET_KEY }}
          AIRFLOW_ADMIN_PASSWORD: ${{ secrets.STAGING_AIRFLOW_ADMIN_PASSWORD }}
          SMTP_HOST:              ${{ secrets.STAGING_SMTP_HOST }}
          SMTP_USER:              ${{ secrets.STAGING_SMTP_USER }}
          SMTP_PASSWORD:          ${{ secrets.STAGING_SMTP_PASSWORD }}
          GROQ_API_KEY:           ${{ secrets.STAGING_GROQ_API_KEY }}
          MCRS_INTERNAL_API_KEY:  ${{ secrets.STAGING_MCRS_INTERNAL_API_KEY }}
          OPENWEATHER_API_KEY:    ${{ secrets.STAGING_OPENWEATHER_API_KEY }}
        with:
          host:     ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key:      ${{ secrets.STAGING_SSH_KEY }}
          port:     ${{ secrets.STAGING_PORT }}
          envs:     GHCR_USERNAME,GHCR_READ_TOKEN,GHCR_BASE,SHA,SUPABASE_DB_PASSWORD,SUPABASE_ANON_KEY,AIRFLOW_DB_PASSWORD,JWT_SECRET,AIRFLOW_FERNET_KEY,AIRFLOW_ADMIN_PASSWORD,SMTP_HOST,SMTP_USER,SMTP_PASSWORD,GROQ_API_KEY,MCRS_INTERNAL_API_KEY,OPENWEATHER_API_KEY
          command_timeout: 30m
          script: |
            set -euo pipefail
            APP_DIR="/opt/imf-pipeline"
            ENVFILE="$APP_DIR/.env.staging"
            COMPOSE_FILE="$APP_DIR/deploy/docker-compose.backend-pipeline.yml"
            DC="docker compose --env-file $ENVFILE -f $COMPOSE_FILE --project-name imf-backend"

            # ── Clone ou mise à jour du dépôt ─────────────────────────────
            REPO_URL="https://x-access-token:${GHCR_READ_TOKEN}@github.com/${{ github.repository }}.git"
            if [ -d "$APP_DIR/.git" ]; then
              echo "==> git pull"
              cd "$APP_DIR"
              chown -R root:root .git
              git remote set-url origin "$REPO_URL"
              git fetch origin main
              git reset --hard origin/main
            else
              echo "==> Clone initial"
              git clone "$REPO_URL" /tmp/imf-clone
              cp -a /tmp/imf-clone/. "$APP_DIR/"
              rm -rf /tmp/imf-clone
              cd "$APP_DIR"
            fi

            # ── Restaurer le modèle MCRS champion (versionné dans le repo) ──
            mkdir -p /ml/models/mcrs/{champion,challenger,archive}
            if [ -d "$APP_DIR/pipeline/models/mcrs/champion" ]; then
              cp -a "$APP_DIR/pipeline/models/mcrs/champion/." /ml/models/mcrs/champion/
              echo "==> Modèle MCRS champion restauré depuis le repo"
            fi

            # ── Écriture .env.staging ─────────────────────────────────────
            cat > "$ENVFILE" << ENVEOF
            # Généré automatiquement par GitHub Actions — NE PAS MODIFIER MANUELLEMENT
            GHCR_BASE=${GHCR_BASE}
            VPS_IP=${{ secrets.STAGING_HOST }}

            SUPABASE_DB_PASSWORD=${SUPABASE_DB_PASSWORD}
            SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
            AIRFLOW_DB_PASSWORD=${AIRFLOW_DB_PASSWORD}

            JWT_SECRET=${JWT_SECRET}
            AIRFLOW_FERNET_KEY=${AIRFLOW_FERNET_KEY}
            AIRFLOW_ADMIN_USER=admin
            AIRFLOW_ADMIN_PASSWORD=${AIRFLOW_ADMIN_PASSWORD}
            AIRFLOW_ADMIN_EMAIL=renekomtsindi7@gmail.com

            SMTP_HOST=${SMTP_HOST}
            SMTP_USER=${SMTP_USER}
            SMTP_PASSWORD=${SMTP_PASSWORD}

            GROQ_API_KEY=${GROQ_API_KEY}

            MCRS_INTERNAL_API_KEY=${MCRS_INTERNAL_API_KEY}
            OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
            ENVEOF
            chmod 600 "$ENVFILE"

            # Persistance SMTP : si les secrets GitHub sont renseignés → sauvegarde locale
            # Si secrets vides → restauration depuis la sauvegarde locale précédente
            SMTP_WRITTEN=$(grep "^SMTP_PASSWORD=" "$ENVFILE" | cut -d= -f2-)
            if [ -n "$SMTP_WRITTEN" ]; then
              grep "^SMTP_" "$ENVFILE" > "$APP_DIR/.env.smtp.local" || true
              chmod 600 "$APP_DIR/.env.smtp.local"
              echo "  SMTP credentials sauvegardés dans .env.smtp.local"
            elif [ -f "$APP_DIR/.env.smtp.local" ]; then
              while IFS= read -r smtpline; do
                SVAR="${smtpline%%=*}"
                if grep -q "^${SVAR}=" "$ENVFILE"; then
                  sed -i "s|^${SVAR}=.*|${smtpline}|" "$ENVFILE"
                else
                  echo "$smtpline" >> "$ENVFILE"
                fi
              done < "$APP_DIR/.env.smtp.local"
              echo "  SMTP credentials restaurés depuis .env.smtp.local"
            fi
            # Persistance GROQ_API_KEY
            GROQ_WRITTEN=$(grep "^GROQ_API_KEY=" "$ENVFILE" | cut -d= -f2-)
            if [ -n "$GROQ_WRITTEN" ]; then
              echo "GROQ_API_KEY=${GROQ_WRITTEN}" > "$APP_DIR/.env.groq.local"
              chmod 600 "$APP_DIR/.env.groq.local"
              echo "  GROQ_API_KEY sauvegardée"
            elif [ -f "$APP_DIR/.env.groq.local" ]; then
              GROQ_SAVED=$(grep "^GROQ_API_KEY=" "$APP_DIR/.env.groq.local" | cut -d= -f2-)
              sed -i "s|^GROQ_API_KEY=.*|GROQ_API_KEY=${GROQ_SAVED}|" "$ENVFILE"
              echo "  GROQ_API_KEY restaurée depuis .env.groq.local"
            fi
            # Persistance MCRS_INTERNAL_API_KEY (même mécanisme que GROQ_API_KEY —
            # clé partagée avec ml-api/Blucash, doit rester stable entre déploiements
            # tant que STAGING_MCRS_INTERNAL_API_KEY n'est pas configurée côté GitHub)
            MCRS_WRITTEN=$(grep "^MCRS_INTERNAL_API_KEY=" "$ENVFILE" | cut -d= -f2-)
            if [ -n "$MCRS_WRITTEN" ]; then
              echo "MCRS_INTERNAL_API_KEY=${MCRS_WRITTEN}" > "$APP_DIR/.env.mcrs.local"
              chmod 600 "$APP_DIR/.env.mcrs.local"
              echo "  MCRS_INTERNAL_API_KEY sauvegardée"
            elif [ -f "$APP_DIR/.env.mcrs.local" ]; then
              MCRS_SAVED=$(grep "^MCRS_INTERNAL_API_KEY=" "$APP_DIR/.env.mcrs.local" | cut -d= -f2-)
              sed -i "s|^MCRS_INTERNAL_API_KEY=.*|MCRS_INTERNAL_API_KEY=${MCRS_SAVED}|" "$ENVFILE"
              echo "  MCRS_INTERNAL_API_KEY restaurée depuis .env.mcrs.local"
            fi
            # Persistance OPENWEATHER_API_KEY (même mécanisme)
            OWM_WRITTEN=$(grep "^OPENWEATHER_API_KEY=" "$ENVFILE" | cut -d= -f2-)
            if [ -n "$OWM_WRITTEN" ]; then
              echo "OPENWEATHER_API_KEY=${OWM_WRITTEN}" > "$APP_DIR/.env.openweather.local"
              chmod 600 "$APP_DIR/.env.openweather.local"
              echo "  OPENWEATHER_API_KEY sauvegardée"
            elif [ -f "$APP_DIR/.env.openweather.local" ]; then
              OWM_SAVED=$(grep "^OPENWEATHER_API_KEY=" "$APP_DIR/.env.openweather.local" | cut -d= -f2-)
              sed -i "s|^OPENWEATHER_API_KEY=.*|OPENWEATHER_API_KEY=${OWM_SAVED}|" "$ENVFILE"
              echo "  OPENWEATHER_API_KEY restaurée depuis .env.openweather.local"
            fi
            echo "==> .env.staging écrit"

            # ── Login GHCR ────────────────────────────────────────────────
            printf '%s' "${GHCR_READ_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin

            # ── Force IPv4 pour les pulls Docker ─────────────────────────
            ip6tables -I OUTPUT -p tcp -d 2606:50c0::/32 --dport 443 \
              -j REJECT --reject-with tcp-reset 2>/dev/null || true

            # ── Pull images backend + pipeline (retry x5) ─────────────────
            for service in backend ml-api airflow-webserver airflow-scheduler; do
              PULL_OK=0
              for attempt in 1 2 3 4 5; do
                if $DC pull $service 2>&1; then PULL_OK=1; break; fi
                echo "==> $service — pull failed (${attempt}/5), retry dans $((attempt * 5))s..."
                sleep $((attempt * 5))
              done
              if [ "$PULL_OK" -ne 1 ]; then
                echo "==> ERROR: impossible de puller $service après 5 tentatives"
                exit 1
              fi
            done

            # ── Restaurer IPv6 ────────────────────────────────────────────
            ip6tables -D OUTPUT -p tcp -d 2606:50c0::/32 --dport 443 \
              -j REJECT --reject-with tcp-reset 2>/dev/null || true

            # ── Sauvegarde images pour rollback ──────────────────────────
            for service in backend ml-api airflow-webserver; do
              CT=$(docker ps -q --filter "name=imf-${service}" 2>/dev/null | head -1)
              [ -n "$CT" ] && docker inspect --format='{{.Config.Image}}' "$CT" 2>/dev/null \
                > "$APP_DIR/.rollback_${service}_staging" || true
            done

            # ── Arrêt propre de la stack backend ─────────────────────────
            # Suppression explicite par nom pour gérer les transitions de project-name
            for ct in imf-backend imf-nginx-api imf-redis imf-ml-api imf-airflow-db imf-airflow-webserver imf-airflow-scheduler; do
              docker stop $ct 2>/dev/null && docker rm $ct 2>/dev/null || true
            done
            $DC down --remove-orphans 2>/dev/null || true

            # ── Démarrage Airflow DB + Redis ──────────────────────────────
            $DC up -d airflow-db redis
            echo "==> Attente Airflow DB healthy..."
            for i in $(seq 1 30); do
              STATUS=$(docker inspect imf-airflow-db --format '{{.State.Health.Status}}' 2>/dev/null || echo "missing")
              [ "$STATUS" = "healthy" ] && break
              echo "  Airflow DB status: $STATUS ($i/30)"
              sleep 3
            done

            # ── Init Airflow (base dédiée airflow-db, une seule fois) ─────
            FLAG="$APP_DIR/.airflow_imf_backend_initialized"
            if [ ! -f "$FLAG" ]; then
              rm -f "$APP_DIR/.airflow_initialized"
              echo "==> Init Airflow DB (airflow-db dédié)..."
              $DC --profile init run --rm airflow-init && touch "$FLAG"
              echo "==> Airflow init OK"
            else
              echo "==> Airflow déjà initialisé — skip"
            fi

            # ── Démarrage stack backend complète ─────────────────────────
            if ! $DC up -d --wait --wait-timeout 300 2>&1; then
              echo ""
              echo "==> ERREUR — état des conteneurs :"
              for ct in imf-airflow-db imf-redis imf-backend imf-ml-api imf-airflow-webserver imf-airflow-scheduler imf-nginx-api; do
                echo "  $ct: $(docker inspect $ct \
                  --format 'status={{.State.Status}} exit={{.State.ExitCode}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}n/a{{end}}' \
                  2>/dev/null || echo 'not found')"
              done
              echo ""
              $DC logs backend --tail 60 2>&1 || true
              $DC logs ml-api  --tail 30 2>&1 || true
              exit 1
            fi
            echo "==> Deploy Backend Staging OK : sha=${SHA}"

            # ── Déclenchement automatique du pipeline de collecte ─────────────
            # Le scheduler Airflow met ~30-90s à découvrir les nouveaux DAGs.
            # On attend jusqu'à 3 min que dag_pipeline_init soit dans la DagModel.
            echo "==> Attente découverte de dag_pipeline_init par le scheduler Airflow..."
            DAG_FOUND=0
            for i in $(seq 1 18); do
              if docker exec imf-airflow-webserver \
                   airflow dags list 2>/dev/null | grep -q "dag_pipeline_init"; then
                DAG_FOUND=1
                break
              fi
              echo "  Scan DAGs en cours ($i/18), attente 10s..."
              sleep 10
            done
            if [ "$DAG_FOUND" = "1" ]; then
              echo "==> Déclenchement automatique du pipeline d'initialisation..."
              docker exec imf-airflow-webserver \
                airflow dags trigger dag_pipeline_init \
                  --run-id "ci_${SHA:-$(date +%s)}" 2>&1 | tail -5 \
                || echo "==> Warning: trigger non-bloquant (DAG déjà en cours ?)"
              echo "==> Pipeline init déclenché — suivi : http://$(hostname -I | awk '{print $1}'):9202"
            else
              echo "==> Warning: dag_pipeline_init non trouvé après 3 min — déclenchez manuellement depuis http://$(hostname -I | awk '{print $1}'):9202"
            fi

      - name: Health check API (port 9090)
        run: |
          for i in 1 2 3 4 5; do
            sleep 20
            if curl -fsS "${{ vars.STAGING_URL }}/health" 2>/dev/null; then
              echo ""
              echo "==> Health check API OK (${{ vars.STAGING_URL }})"
              exit 0
            fi
            echo "Tentative $i/5 échouée..."
          done
          echo "Health check API final échoué"
          exit 1

      - name: Vérification Swagger spec (diagnostic)
        continue-on-error: true
        run: |
          echo "==> Vérification du spec OpenAPI (groupe auth)..."
          SPEC=$(curl -fsS "${{ vars.STAGING_URL }}/api-docs/auth" 2>/dev/null || echo "{}")
          NB_PATHS=$(echo "$SPEC" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('paths',{})))" 2>/dev/null || echo "0")
          echo "==> Nb opérations dans le groupe 'auth' : $NB_PATHS"
          if [ "$NB_PATHS" = "0" ]; then
            echo "==> ATTENTION : groupe auth vide — springdoc ne détecte pas le préfixe /api/v1 ?"
            echo "==> Chemins générés (extrait) :"
            curl -fsS "${{ vars.STAGING_URL }}/api-docs" 2>/dev/null \
              | python3 -c "import sys,json; d=json.load(sys.stdin); paths=list(d.get('paths',{}).keys())[:5]; print('\n'.join(paths))" 2>/dev/null || true
          else
            echo "==> Swagger OK — $NB_PATHS opérations dans 'auth'"
          fi

      - name: Rollback automatique backend
        if: failure() && steps.deploy.outcome == 'success'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key:      ${{ secrets.STAGING_SSH_KEY }}
          port:     ${{ secrets.STAGING_PORT }}
          script: |
            set -euo pipefail
            APP_DIR="/opt/imf-pipeline"
            DC="docker compose --env-file $APP_DIR/.env.staging -f $APP_DIR/deploy/docker-compose.backend-pipeline.yml --project-name imf-backend"

            echo "==> ROLLBACK Backend Staging déclenché"
            $DC down --remove-orphans 2>/dev/null || true

            for service in backend ml-api airflow-webserver; do
              ROLLBACK=$(cat "$APP_DIR/.rollback_${service}_staging" 2>/dev/null || echo "")
              if [ -n "$ROLLBACK" ]; then
                echo "==> Rollback $service → $ROLLBACK"
                docker pull "$ROLLBACK"
              fi
            done

            $DC up -d --wait --wait-timeout 120
            echo "==> Rollback Backend Staging OK"

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 10 — Deploy Frontend → Staging  (port 9091)
  # ════════════════════════════════════════════════════════════════════════════
  deploy-frontend-staging:
    name: "Deploy Frontend Web → Staging (:9091)"
    needs: [bootstrap-staging, build-frontend]
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'))
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_env != 'production')
    runs-on: self-hosted
    environment:
      name: staging
      url: http://84.247.128.40:9091
    outputs:
      deployed: ${{ steps.deploy.outcome }}

    steps:
      - name: Mask secrets
        run: |
          echo "::add-mask::${{ secrets.STAGING_HOST }}"
          echo "::add-mask::${{ secrets.STAGING_SSH_KEY }}"

      - name: Short SHA
        id: short_sha
        run: echo "sha=$(printf '%.7s' '${{ github.sha }}')" >> $GITHUB_OUTPUT

      - name: Lowercase GHCR base
        run: echo "GHCR_BASE=$(echo '${{ env.REGISTRY }}/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Deploy frontend web (staging)
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USERNAME:   ${{ github.actor }}
          GHCR_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_BASE:       ${{ env.GHCR_BASE }}
          SHA:             ${{ steps.short_sha.outputs.sha }}
        with:
          host:     ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key:      ${{ secrets.STAGING_SSH_KEY }}
          port:     ${{ secrets.STAGING_PORT }}
          envs:     GHCR_USERNAME,GHCR_READ_TOKEN,GHCR_BASE,SHA
          command_timeout: 15m
          script: |
            set -euo pipefail
            APP_DIR="/opt/imf-pipeline"
            ENVFILE="$APP_DIR/.env.staging"
            COMPOSE_FILE="$APP_DIR/deploy/docker-compose.frontend.yml"
            DC="docker compose --env-file $ENVFILE -f $COMPOSE_FILE --project-name imf-frontend"

            # ── Mise à jour du dépôt (config nginx frontend) ─────────────
            REPO_URL="https://x-access-token:${GHCR_READ_TOKEN}@github.com/${{ github.repository }}.git"
            if [ -d "$APP_DIR/.git" ]; then
              cd "$APP_DIR"
              rm -f .git/index.lock 2>/dev/null || true
              chown -R root:root .git
              git remote set-url origin "$REPO_URL"
              git fetch origin main
              git reset --hard origin/main
            else
              git clone "$REPO_URL" /tmp/imf-clone
              cp -a /tmp/imf-clone/. "$APP_DIR/"
              rm -rf /tmp/imf-clone
              cd "$APP_DIR"
            fi

            # ── Mise à jour de GHCR_BASE dans .env.staging ────────────────
            if [ -f "$ENVFILE" ]; then
              sed -i "s|^GHCR_BASE=.*|GHCR_BASE=${GHCR_BASE}|" "$ENVFILE"
            else
              echo "GHCR_BASE=${GHCR_BASE}" > "$ENVFILE"
              chmod 600 "$ENVFILE"
            fi

            # ── Login GHCR ────────────────────────────────────────────────
            printf '%s' "${GHCR_READ_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin

            # ── Force IPv4 pour les pulls Docker ─────────────────────────
            ip6tables -I OUTPUT -p tcp -d 2606:50c0::/32 --dport 443 \
              -j REJECT --reject-with tcp-reset 2>/dev/null || true

            # ── Pull image frontend (retry x5) ────────────────────────────
            PULL_OK=0
            for attempt in 1 2 3 4 5; do
              if $DC pull frontend 2>&1; then PULL_OK=1; break; fi
              echo "==> frontend — pull failed (${attempt}/5), retry dans $((attempt * 5))s..."
              sleep $((attempt * 5))
            done
            if [ "$PULL_OK" -ne 1 ]; then
              echo "==> ERROR: impossible de puller frontend après 5 tentatives"
              exit 1
            fi

            # ── Restaurer IPv6 ────────────────────────────────────────────
            ip6tables -D OUTPUT -p tcp -d 2606:50c0::/32 --dport 443 \
              -j REJECT --reject-with tcp-reset 2>/dev/null || true

            # ── Sauvegarde image pour rollback ────────────────────────────
            CT=$(docker ps -q --filter "name=imf-frontend" 2>/dev/null | head -1)
            [ -n "$CT" ] && docker inspect --format='{{.Config.Image}}' "$CT" 2>/dev/null \
              > "$APP_DIR/.rollback_frontend_staging" || true

            # ── Arrêt et redémarrage du frontend ─────────────────────────
            # Suppression explicite par nom pour gérer les transitions de project-name
            docker stop imf-frontend 2>/dev/null && docker rm imf-frontend 2>/dev/null || true
            $DC down --remove-orphans 2>/dev/null || true

            if ! $DC up -d --wait --wait-timeout 120 2>&1; then
              echo ""
              echo "==> ERREUR — état du conteneur frontend :"
              docker inspect imf-frontend \
                --format 'status={{.State.Status}} exit={{.State.ExitCode}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}n/a{{end}}' \
                2>/dev/null || echo "not found"
              $DC logs frontend --tail 40 2>&1 || true
              exit 1
            fi
            echo "==> Deploy Frontend Staging OK : sha=${SHA}"

      - name: Health check Web (port 9091)
        run: |
          for i in 1 2 3 4 5; do
            sleep 15
            if curl -fsS "http://84.247.128.40:9091/health" 2>/dev/null; then
              echo ""
              echo "==> Health check Web OK (http://84.247.128.40:9091)"
              exit 0
            fi
            echo "Tentative $i/5 échouée..."
          done
          echo "Health check Web final échoué"
          exit 1

      - name: Rollback automatique frontend
        if: failure() && steps.deploy.outcome == 'success'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key:      ${{ secrets.STAGING_SSH_KEY }}
          port:     ${{ secrets.STAGING_PORT }}
          script: |
            set -euo pipefail
            APP_DIR="/opt/imf-pipeline"
            DC="docker compose --env-file $APP_DIR/.env.staging -f $APP_DIR/deploy/docker-compose.frontend.yml --project-name imf-frontend"

            echo "==> ROLLBACK Frontend Staging déclenché"
            $DC down --remove-orphans 2>/dev/null || true
            ROLLBACK=$(cat "$APP_DIR/.rollback_frontend_staging" 2>/dev/null || echo "")
            [ -n "$ROLLBACK" ] && docker pull "$ROLLBACK"
            $DC up -d --wait --wait-timeout 60
            echo "==> Rollback Frontend Staging OK"

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 11 — Deploy Backend + Pipeline → Production  (manuel uniquement)
  # ════════════════════════════════════════════════════════════════════════════
  deploy-backend-production:
    name: "Deploy Backend + Pipeline → Production"
    needs: [build-backend, build-ml-api, build-airflow]
    if: |
      github.event_name == 'workflow_dispatch'
      && github.event.inputs.deploy_env == 'production'
      && github.event.inputs.confirm_prod == 'DEPLOY'
    runs-on: self-hosted
    environment:
      name: ${{ github.event.inputs.deploy_env }}

    steps:
      - name: Mask secrets
        run: |
          echo "::add-mask::${{ secrets.PROD_HOST }}"
          echo "::add-mask::${{ secrets.PROD_SSH_KEY }}"
          echo "::add-mask::${{ secrets.PROD_SUPABASE_DB_PASSWORD }}"
          echo "::add-mask::${{ secrets.PROD_SUPABASE_ANON_KEY }}"
          echo "::add-mask::${{ secrets.PROD_AIRFLOW_DB_PASSWORD }}"
          echo "::add-mask::${{ secrets.PROD_JWT_SECRET }}"
          echo "::add-mask::${{ secrets.PROD_AIRFLOW_FERNET_KEY }}"
          echo "::add-mask::${{ secrets.PROD_AIRFLOW_ADMIN_PASSWORD }}"

      - name: Short SHA
        id: short_sha
        run: echo "sha=$(printf '%.7s' '${{ github.sha }}')" >> $GITHUB_OUTPUT

      - name: Lowercase GHCR base
        run: echo "GHCR_BASE=$(echo '${{ env.REGISTRY }}/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Deploy backend + pipeline (production)
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USERNAME:          ${{ github.actor }}
          GHCR_READ_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
          GHCR_BASE:              ${{ env.GHCR_BASE }}
          SHA:                    ${{ steps.short_sha.outputs.sha }}
          SUPABASE_DB_PASSWORD:   ${{ secrets.PROD_SUPABASE_DB_PASSWORD }}
          SUPABASE_ANON_KEY:      ${{ secrets.PROD_SUPABASE_ANON_KEY }}
          AIRFLOW_DB_PASSWORD:    ${{ secrets.PROD_AIRFLOW_DB_PASSWORD }}
          JWT_SECRET:             ${{ secrets.PROD_JWT_SECRET }}
          AIRFLOW_FERNET_KEY:     ${{ secrets.PROD_AIRFLOW_FERNET_KEY }}
          AIRFLOW_ADMIN_PASSWORD: ${{ secrets.PROD_AIRFLOW_ADMIN_PASSWORD }}
        with:
          host:     ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key:      ${{ secrets.PROD_SSH_KEY }}
          envs:     GHCR_USERNAME,GHCR_READ_TOKEN,GHCR_BASE,SHA,SUPABASE_DB_PASSWORD,SUPABASE_ANON_KEY,AIRFLOW_DB_PASSWORD,JWT_SECRET,AIRFLOW_FERNET_KEY,AIRFLOW_ADMIN_PASSWORD
          command_timeout: 30m
          script: |
            set -euo pipefail
            APP_DIR="/opt/imf-pipeline"
            ENVFILE="$APP_DIR/.env.production"
            COMPOSE_FILE="$APP_DIR/deploy/docker-compose.backend-pipeline.yml"
            DC="docker compose --env-file $ENVFILE -f $COMPOSE_FILE --project-name imf-backend"

            REPO_URL="https://x-access-token:${GHCR_READ_TOKEN}@github.com/${{ github.repository }}.git"
            if [ -d "$APP_DIR/.git" ]; then
              cd "$APP_DIR"; chown -R root:root .git
              git remote set-url origin "$REPO_URL"
              git fetch origin main && git reset --hard origin/main
            else
              git clone "$REPO_URL" /tmp/imf-clone
              cp -a /tmp/imf-clone/. "$APP_DIR/"
              rm -rf /tmp/imf-clone
              cd "$APP_DIR"
            fi

            # ── Restaurer le modèle MCRS champion (versionné dans le repo) ──
            mkdir -p /ml/models/mcrs/{champion,challenger,archive}
            if [ -d "$APP_DIR/pipeline/models/mcrs/champion" ]; then
              cp -a "$APP_DIR/pipeline/models/mcrs/champion/." /ml/models/mcrs/champion/
              echo "==> Modèle MCRS champion restauré depuis le repo"
            fi

            cat > "$ENVFILE" << ENVEOF
            # Généré automatiquement par GitHub Actions — NE PAS MODIFIER MANUELLEMENT
            GHCR_BASE=${GHCR_BASE}
            VPS_IP=${{ secrets.PROD_HOST }}

            SUPABASE_DB_PASSWORD=${SUPABASE_DB_PASSWORD}
            SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
            AIRFLOW_DB_PASSWORD=${AIRFLOW_DB_PASSWORD}

            JWT_SECRET=${JWT_SECRET}
            AIRFLOW_FERNET_KEY=${AIRFLOW_FERNET_KEY}
            AIRFLOW_ADMIN_USER=admin
            AIRFLOW_ADMIN_PASSWORD=${AIRFLOW_ADMIN_PASSWORD}
            AIRFLOW_ADMIN_EMAIL=renekomtsindi7@gmail.com
            ENVEOF
            chmod 600 "$ENVFILE"

            printf '%s' "${GHCR_READ_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin

            ip6tables -I OUTPUT -p tcp -d 2606:50c0::/32 --dport 443 \
              -j REJECT --reject-with tcp-reset 2>/dev/null || true

            for service in backend ml-api airflow-webserver airflow-scheduler; do
              PULL_OK=0
              for attempt in 1 2 3 4 5; do
                if $DC pull $service; then PULL_OK=1; break; fi
                sleep $((attempt * 5))
              done
              [ "$PULL_OK" -ne 1 ] && echo "ERROR: pull $service" && exit 1
            done

            ip6tables -D OUTPUT -p tcp -d 2606:50c0::/32 --dport 443 \
              -j REJECT --reject-with tcp-reset 2>/dev/null || true

            for service in backend ml-api airflow-webserver; do
              CT=$(docker ps -q --filter "name=imf-${service}" 2>/dev/null | head -1)
              [ -n "$CT" ] && docker inspect --format='{{.Config.Image}}' "$CT" 2>/dev/null \
                > "$APP_DIR/.rollback_${service}_prod" || true
            done

            $DC down --remove-orphans 2>/dev/null || true

            $DC up -d airflow-db redis
            for i in $(seq 1 30); do
              STATUS=$(docker inspect imf-airflow-db --format '{{.State.Health.Status}}' 2>/dev/null || echo "missing")
              [ "$STATUS" = "healthy" ] && break
              sleep 3
            done

            FLAG="$APP_DIR/.airflow_imf_backend_initialized"
            if [ ! -f "$FLAG" ]; then
              rm -f "$APP_DIR/.airflow_initialized"
              $DC --profile init run --rm airflow-init && touch "$FLAG"
            fi

            $DC up -d --wait --wait-timeout 300
            echo "==> Deploy Backend Production OK : sha=${SHA}"

      - name: Health check production API
        run: |
          for i in 1 2 3 4 5; do
            sleep 20
            if curl -fsS "${{ vars.PRODUCTION_URL }}/health" 2>/dev/null; then
              echo "==> Production API OK"
              exit 0
            fi
            echo "Tentative $i/5 échouée"
          done
          echo "Health check production API échoué"
          exit 1

      - name: Rollback production backend
        if: failure() && steps.deploy.outcome == 'success'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key:      ${{ secrets.PROD_SSH_KEY }}
          script: |
            APP_DIR="/opt/imf-pipeline"
            DC="docker compose --env-file $APP_DIR/.env.production -f $APP_DIR/deploy/docker-compose.backend-pipeline.yml --project-name imf-backend"
            $DC down --remove-orphans 2>/dev/null || true
            for service in backend ml-api airflow-webserver; do
              ROLLBACK=$(cat "$APP_DIR/.rollback_${service}_prod" 2>/dev/null || echo "")
              [ -n "$ROLLBACK" ] && docker pull "$ROLLBACK"
            done
            $DC up -d --wait --wait-timeout 120
            echo "==> Rollback Backend Production OK"

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 12 — Deploy Frontend → Production  (manuel uniquement)
  # ════════════════════════════════════════════════════════════════════════════
  deploy-frontend-production:
    name: "Deploy Frontend Web → Production"
    needs: [build-frontend]
    if: |
      github.event_name == 'workflow_dispatch'
      && github.event.inputs.deploy_env == 'production'
      && github.event.inputs.confirm_prod == 'DEPLOY'
    runs-on: self-hosted
    environment:
      name: ${{ github.event.inputs.deploy_env }}

    steps:
      - name: Mask secrets
        run: |
          echo "::add-mask::${{ secrets.PROD_HOST }}"
          echo "::add-mask::${{ secrets.PROD_SSH_KEY }}"

      - name: Short SHA
        id: short_sha
        run: echo "sha=$(printf '%.7s' '${{ github.sha }}')" >> $GITHUB_OUTPUT

      - name: Lowercase GHCR base
        run: echo "GHCR_BASE=$(echo '${{ env.REGISTRY }}/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Deploy frontend web (production)
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USERNAME:   ${{ github.actor }}
          GHCR_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_BASE:       ${{ env.GHCR_BASE }}
          SHA:             ${{ steps.short_sha.outputs.sha }}
        with:
          host:     ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key:      ${{ secrets.PROD_SSH_KEY }}
          envs:     GHCR_USERNAME,GHCR_READ_TOKEN,GHCR_BASE,SHA
          command_timeout: 15m
          script: |
            set -euo pipefail
            APP_DIR="/opt/imf-pipeline"
            ENVFILE="$APP_DIR/.env.production"
            COMPOSE_FILE="$APP_DIR/deploy/docker-compose.frontend.yml"
            DC="docker compose --env-file $ENVFILE -f $COMPOSE_FILE --project-name imf-frontend"

            REPO_URL="https://x-access-token:${GHCR_READ_TOKEN}@github.com/${{ github.repository }}.git"
            if [ -d "$APP_DIR/.git" ]; then
              cd "$APP_DIR"; chown -R root:root .git
              git remote set-url origin "$REPO_URL"
              git fetch origin main && git reset --hard origin/main
            else
              git clone "$REPO_URL" /tmp/imf-clone
              cp -a /tmp/imf-clone/. "$APP_DIR/"
              rm -rf /tmp/imf-clone
              cd "$APP_DIR"
            fi

            if [ -f "$ENVFILE" ]; then
              sed -i "s|^GHCR_BASE=.*|GHCR_BASE=${GHCR_BASE}|" "$ENVFILE"
            else
              echo "GHCR_BASE=${GHCR_BASE}" > "$ENVFILE"
              chmod 600 "$ENVFILE"
            fi

            printf '%s' "${GHCR_READ_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin

            ip6tables -I OUTPUT -p tcp -d 2606:50c0::/32 --dport 443 \
              -j REJECT --reject-with tcp-reset 2>/dev/null || true

            PULL_OK=0
            for attempt in 1 2 3 4 5; do
              if $DC pull frontend; then PULL_OK=1; break; fi
              sleep $((attempt * 5))
            done
            [ "$PULL_OK" -ne 1 ] && echo "ERROR: pull frontend" && exit 1

            ip6tables -D OUTPUT -p tcp -d 2606:50c0::/32 --dport 443 \
              -j REJECT --reject-with tcp-reset 2>/dev/null || true

            CT=$(docker ps -q --filter "name=imf-frontend" 2>/dev/null | head -1)
            [ -n "$CT" ] && docker inspect --format='{{.Config.Image}}' "$CT" 2>/dev/null \
              > "$APP_DIR/.rollback_frontend_prod" || true

            $DC down --remove-orphans 2>/dev/null || true
            $DC up -d --wait --wait-timeout 120
            echo "==> Deploy Frontend Production OK : sha=${SHA}"

      - name: Health check production Web
        run: |
          for i in 1 2 3 4 5; do
            sleep 15
            if curl -fsS "${{ vars.PRODUCTION_WEB_URL }}/health" 2>/dev/null; then
              echo "==> Production Web OK"
              exit 0
            fi
            echo "Tentative $i/5 échouée"
          done
          echo "Health check production Web échoué"
          exit 1

      - name: Rollback production frontend
        if: failure() && steps.deploy.outcome == 'success'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key:      ${{ secrets.PROD_SSH_KEY }}
          script: |
            APP_DIR="/opt/imf-pipeline"
            DC="docker compose --env-file $APP_DIR/.env.production -f $APP_DIR/deploy/docker-compose.frontend.yml --project-name imf-frontend"
            $DC down --remove-orphans 2>/dev/null || true
            ROLLBACK=$(cat "$APP_DIR/.rollback_frontend_prod" 2>/dev/null || echo "")
            [ -n "$ROLLBACK" ] && docker pull "$ROLLBACK"
            $DC up -d --wait --wait-timeout 60
            echo "==> Rollback Frontend Production OK"

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 13 — Résumé Pipeline  (toujours affiché)
  # ════════════════════════════════════════════════════════════════════════════
  summary:
    name: "Résumé Pipeline"
    needs:
      - backend-ci
      - pipeline-ci
      - frontend-ci
      - build-backend
      - build-ml-api
      - build-airflow
      - build-frontend
      - deploy-backend-staging
      - deploy-frontend-staging
      - deploy-backend-production
      - deploy-frontend-production
    if: always()
    runs-on: self-hosted
    steps:
      - name: Rapport
        run: |
          echo "## CI/CD — IMF Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | CI | Build/Push | Deploy Backend :9090 | Deploy Frontend :9091 |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|----|-----------|--------------------|---------------------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend (Spring Boot)  | ${{ needs.backend-ci.result }}  | ${{ needs.build-backend.result }}  | ${{ needs.deploy-backend-staging.result }} | — |" >> $GITHUB_STEP_SUMMARY
          echo "| ML API (FastAPI)       | ${{ needs.pipeline-ci.result }} | ${{ needs.build-ml-api.result }}  | ${{ needs.deploy-backend-staging.result }} | — |" >> $GITHUB_STEP_SUMMARY
          echo "| Airflow + DAGs         | ${{ needs.pipeline-ci.result }} | ${{ needs.build-airflow.result }} | ${{ needs.deploy-backend-staging.result }} | — |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Angular       | ${{ needs.frontend-ci.result }} | ${{ needs.build-frontend.result }}| — | ${{ needs.deploy-frontend-staging.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Branche | SHA |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| \`${{ github.ref_name }}\` | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
