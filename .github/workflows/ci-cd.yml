name: CI/CD — IMF Pipeline

# ──────────────────────────────────────────────────────────────────────────────
# Stratégie :
#   push dev/staging/main  → CI complet (qualité + tests)
#   push main/staging      → CI + Build 4 images Docker + Bootstrap VPS + Deploy Staging
#   workflow_dispatch      → CI + deploy staging OU production selon inputs
#   pull_request           → CI uniquement (pas de deploy)
#
# Images Docker (GHCR) :
#   imf-backend   → backend/Dockerfile       (Spring Boot / Java 17)
#   imf-ml-api    → pipeline/Dockerfile.ml   (FastAPI ML scoring)
#   imf-airflow   → pipeline/Dockerfile.airflow (Airflow 2.8 + DAGs)
#   imf-frontend  → web/Dockerfile           (Angular 17 / nginx)
#
# Fichiers de déploiement (versionnés dans le repo) :
#   deploy/docker-compose.staging.yml
#   deploy/nginx/nginx-imf.conf
#   deploy/nginx/frontend-staging.conf
#   deploy/init-db.sh
#
# Secrets GitHub requis :
#   STAGING_HOST, STAGING_USER, STAGING_SSH_KEY, STAGING_PORT
#   STAGING_DB_PASSWORD        — mot de passe PostgreSQL staging
#   STAGING_JWT_SECRET         — secret JWT Spring Boot + Airflow webserver
#   STAGING_AIRFLOW_FERNET_KEY — clé Fernet Airflow (base64url 32 octets)
#   STAGING_AIRFLOW_ADMIN_PASSWORD — mot de passe UI Airflow
#   PROD_HOST, PROD_USER, PROD_SSH_KEY
#   PROD_DB_PASSWORD, PROD_JWT_SECRET, PROD_AIRFLOW_FERNET_KEY, PROD_AIRFLOW_ADMIN_PASSWORD
#
# Variables GitHub requises :
#   STAGING_URL     ex : http://84.247.128.40:9090
#   PRODUCTION_URL  ex : https://imf.votredomaine.com
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]
  workflow_dispatch:
    inputs:
      deploy_env:
        description: "Environnement de déploiement"
        required: false
        default: staging
        type: choice
        options: [staging, production]
      confirm_prod:
        description: "Production uniquement : taper exactement 'DEPLOY' pour confirmer"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: imf-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY:        ghcr.io
  JAVA_VERSION:    "17"
  PYTHON_VERSION:  "3.11"
  NODE_VERSION:    "20"
  BACKEND_IMAGE:   ${{ github.repository }}/imf-backend
  ML_API_IMAGE:    ${{ github.repository }}/imf-ml-api
  AIRFLOW_IMAGE:   ${{ github.repository }}/imf-airflow
  FRONTEND_IMAGE:  ${{ github.repository }}/imf-frontend
  SPRING_PROFILES_ACTIVE: test
  APP_ENV:         testing

jobs:

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 1 — Backend CI  (Spring Boot / Java 17 / Maven)
  # ════════════════════════════════════════════════════════════════════════════
  backend-ci:
    name: "Backend CI (Java 17 / Maven)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Compile
        run: mvn -B compile -Dmaven.test.skip=true

      - name: Tests (JUnit)
        run: mvn -B test
        env:
          SPRING_PROFILES_ACTIVE: test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-backend-${{ github.sha }}
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 2 — Pipeline CI  (Python 3.11 / black / flake8 / pytest)
  # ════════════════════════════════════════════════════════════════════════════
  pipeline-ci:
    name: "Pipeline CI (Python 3.11)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linters
        run: pip install black flake8 isort bandit

      - name: Black
        run: black --check --diff src/ dags/

      - name: isort
        run: isort --check-only --diff src/ dags/

      - name: Flake8
        run: flake8 src/ dags/ --max-line-length 120 --exclude dbt_project/

      - name: Bandit
        run: bandit -r src/ --severity-level medium --confidence-level medium
        continue-on-error: true

      - name: Tests (pytest)
        run: |
          if [ -d tests ]; then
            pip install -r requirements-ci.txt
            pytest tests/ -v --tb=short --junitxml=../junit-pipeline.xml
          else
            echo "Aucun dossier tests/ — étape ignorée"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-pipeline-${{ github.sha }}
          path: junit-pipeline.xml
          if-no-files-found: ignore

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 3 — Frontend CI  (Angular 17 / Node 20)
  # ════════════════════════════════════════════════════════════════════════════
  frontend-ci:
    name: "Frontend CI (Angular 17 / Node 20)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Prettier check
        run: npx prettier --check "src/**/*.{ts,html,scss}"

      - name: TypeScript check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Build production
        run: npm run build -- --configuration production

  # ════════════════════════════════════════════════════════════════════════════
  # JOBs 4-7 — Build & Push images Docker  (main/staging push + dispatch)
  # ════════════════════════════════════════════════════════════════════════════
  build-backend:
    name: "Build & Push imf-backend (GHCR)"
    needs: backend-ci
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'))
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-ml-api:
    name: "Build & Push imf-ml-api (GHCR)"
    needs: pipeline-ci
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'))
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ML_API_IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v5
        with:
          context: ./pipeline
          file: ./pipeline/Dockerfile.ml
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-airflow:
    name: "Build & Push imf-airflow (GHCR)"
    needs: pipeline-ci
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'))
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.AIRFLOW_IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v5
        with:
          context: ./pipeline
          file: ./pipeline/Dockerfile.airflow
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: "Build & Push imf-frontend (GHCR)"
    needs: frontend-ci
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'))
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 8 — Bootstrap VPS Staging
  # Installe Docker + Compose + IPv6 + répertoires, puis initialise Airflow DB
  # ════════════════════════════════════════════════════════════════════════════
  bootstrap-staging:
    name: "Bootstrap VPS Staging"
    needs: [build-backend, build-ml-api, build-airflow, build-frontend]
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'))
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_env != 'production')
    runs-on: ubuntu-latest
    steps:
      - name: Mask secrets
        run: |
          echo "::add-mask::${{ secrets.STAGING_HOST }}"
          echo "::add-mask::${{ secrets.STAGING_SSH_KEY }}"
          echo "::add-mask::${{ secrets.STAGING_DB_PASSWORD }}"
          echo "::add-mask::${{ secrets.STAGING_JWT_SECRET }}"
          echo "::add-mask::${{ secrets.STAGING_AIRFLOW_FERNET_KEY }}"
          echo "::add-mask::${{ secrets.STAGING_AIRFLOW_ADMIN_PASSWORD }}"

      - name: Bootstrap Docker + Compose + IPv6 + répertoires
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key:      ${{ secrets.STAGING_SSH_KEY }}
          port:     ${{ secrets.STAGING_PORT }}
          script: |
            set -euo pipefail

            # ── Docker ──────────────────────────────────────────────────────
            if ! command -v docker &>/dev/null; then
              curl -fsSL https://get.docker.com | sh
              usermod -aG docker "$USER"
              systemctl enable --now docker
              echo "==> Docker installé : $(docker --version)"
            else
              echo "==> Docker OK : $(docker --version)"
            fi

            # ── Docker Compose plugin ────────────────────────────────────────
            if ! docker compose version &>/dev/null 2>&1; then
              mkdir -p /usr/local/lib/docker/cli-plugins
              COMPOSE_URL="https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)"
              curl -SL "$COMPOSE_URL" -o /usr/local/lib/docker/cli-plugins/docker-compose
              chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
              echo "==> Compose installé : $(docker compose version)"
            else
              echo "==> Compose OK : $(docker compose version)"
            fi

            # ── IPv6 + ip6tables (REJECT Fastly → force IPv4 pour pulls GHCR) ─
            DAEMON_JSON="/etc/docker/daemon.json"
            IP6_RESTART=false
            if [ ! -f "$DAEMON_JSON" ]; then
              echo '{"ipv6":true,"fixed-cidr-v6":"fd00::/80","ip6tables":true}' > "$DAEMON_JSON"
              IP6_RESTART=true
            elif ! python3 -c "import json; d=json.load(open('$DAEMON_JSON')); exit(0 if d.get('ip6tables') else 1)" 2>/dev/null; then
              python3 -c "import json; d=json.load(open('/etc/docker/daemon.json')); d.update({'ipv6':True,'ip6tables':True}); d.setdefault('fixed-cidr-v6','fd00::/80'); open('/etc/docker/daemon.json','w').write(json.dumps(d,indent=2))"
              IP6_RESTART=true
            fi
            $IP6_RESTART && systemctl restart docker && sleep 10 || true
            ip6tables -t mangle -C POSTROUTING -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --set-mss 1280 2>/dev/null || \
              ip6tables -t mangle -A POSTROUTING -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --set-mss 1280 2>/dev/null || true
            ip6tables -C OUTPUT -p tcp -d 2606:50c0::/32 --dport 443 -j REJECT 2>/dev/null || \
              ip6tables -I OUTPUT -p tcp -d 2606:50c0::/32 --dport 443 -j REJECT --reject-with tcp-reset 2>/dev/null || true
            echo "==> IPv6/ip6tables OK"

            # ── Répertoires IMF ──────────────────────────────────────────────
            mkdir -p /opt/imf-pipeline/{backups,logs}
            mkdir -p /ml/models/mcrs/{champion,challenger,archive}
            echo "==> Répertoires OK"

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 9 — Deploy Staging
  # ════════════════════════════════════════════════════════════════════════════
  deploy-staging:
    name: "Deploy → Staging"
    needs: bootstrap-staging
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'))
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_env != 'production')
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    outputs:
      deployed: ${{ steps.deploy.outcome }}

    steps:
      - name: Mask secrets
        run: |
          echo "::add-mask::${{ secrets.STAGING_HOST }}"
          echo "::add-mask::${{ secrets.STAGING_SSH_KEY }}"
          echo "::add-mask::${{ secrets.STAGING_DB_PASSWORD }}"
          echo "::add-mask::${{ secrets.STAGING_JWT_SECRET }}"
          echo "::add-mask::${{ secrets.STAGING_AIRFLOW_FERNET_KEY }}"
          echo "::add-mask::${{ secrets.STAGING_AIRFLOW_ADMIN_PASSWORD }}"

      - name: Short SHA
        run: echo "SHA_SHORT=$(printf '%.7s' '${{ github.sha }}')" >> $GITHUB_ENV

      - name: Deploy IMF Pipeline (staging)
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USERNAME:            ${{ github.actor }}
          GHCR_READ_TOKEN:          ${{ secrets.GITHUB_TOKEN }}
          GHCR_BASE:                ${{ env.REGISTRY }}/${{ github.repository }}
          SHA:                      ${{ env.SHA_SHORT }}
          DB_PASSWORD:              ${{ secrets.STAGING_DB_PASSWORD }}
          JWT_SECRET:               ${{ secrets.STAGING_JWT_SECRET }}
          AIRFLOW_FERNET_KEY:       ${{ secrets.STAGING_AIRFLOW_FERNET_KEY }}
          AIRFLOW_ADMIN_PASSWORD:   ${{ secrets.STAGING_AIRFLOW_ADMIN_PASSWORD }}
        with:
          host:     ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key:      ${{ secrets.STAGING_SSH_KEY }}
          port:     ${{ secrets.STAGING_PORT }}
          envs:     GHCR_USERNAME,GHCR_READ_TOKEN,GHCR_BASE,SHA,DB_PASSWORD,JWT_SECRET,AIRFLOW_FERNET_KEY,AIRFLOW_ADMIN_PASSWORD
          command_timeout: 30m
          script: |
            set -euo pipefail
            APP_DIR="/opt/imf-pipeline"
            ENVFILE="$APP_DIR/.env.staging"
            COMPOSE_FILE="$APP_DIR/deploy/docker-compose.staging.yml"
            DC="docker compose --env-file $ENVFILE -f $COMPOSE_FILE"

            # ── Clone ou mise à jour du dépôt ─────────────────────────────
            REPO_URL="https://x-access-token:${GHCR_READ_TOKEN}@github.com/${{ github.repository }}.git"
            if [ -d "$APP_DIR/.git" ]; then
              echo "==> git pull"
              cd "$APP_DIR"
              chown -R root:root .git
              git remote set-url origin "$REPO_URL"
              git fetch origin main
              git reset --hard origin/main
            else
              echo "==> Clone initial (répertoire préexistant préservé)"
              # bootstrap a pu créer /opt/imf-pipeline/{backups,logs} avant le clone
              git clone "$REPO_URL" /tmp/imf-clone
              cp -a /tmp/imf-clone/. "$APP_DIR/"
              rm -rf /tmp/imf-clone
              cd "$APP_DIR"
            fi
            chmod +x "$APP_DIR/deploy/init-db.sh"

            # ── Écriture .env.staging (secrets injectés par GitHub Actions) ─
            cat > "$ENVFILE" << ENVEOF
            # Généré automatiquement par GitHub Actions — NE PAS MODIFIER MANUELLEMENT
            GHCR_BASE=${GHCR_BASE}
            VPS_IP=${{ secrets.STAGING_HOST }}

            DB_USER=imf_user
            DB_PASSWORD=${DB_PASSWORD}
            DB_NAME=imf_db
            DB_AIRFLOW=airflow_db

            JWT_SECRET=${JWT_SECRET}
            AIRFLOW_FERNET_KEY=${AIRFLOW_FERNET_KEY}
            AIRFLOW_ADMIN_USER=admin
            AIRFLOW_ADMIN_PASSWORD=${AIRFLOW_ADMIN_PASSWORD}
            AIRFLOW_ADMIN_EMAIL=renekomtsindi7@gmail.com
            ENVEOF
            chmod 600 "$ENVFILE"
            echo "==> .env.staging écrit"

            # ── Login GHCR ────────────────────────────────────────────────
            printf '%s' "${GHCR_READ_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin

            # ── Force IPv4 pour les pulls Docker ─────────────────────────
            ip6tables -I OUTPUT -p tcp -d 2606:50c0::/32 --dport 443 \
              -j REJECT --reject-with tcp-reset 2>/dev/null || true

            # ── Pull des images (avec retry x5) ──────────────────────────
            for service in backend ml-api airflow-webserver airflow-scheduler frontend; do
              PULL_OK=0
              for attempt in 1 2 3 4 5; do
                if $DC pull $service 2>&1; then PULL_OK=1; break; fi
                echo "==> $service — pull failed (${attempt}/5), retry dans $((attempt * 5))s..."
                sleep $((attempt * 5))
              done
              if [ "$PULL_OK" -ne 1 ]; then
                echo "==> ERROR: impossible de puller $service après 5 tentatives"
                exit 1
              fi
            done

            # ── Restaurer IPv6 ────────────────────────────────────────────
            ip6tables -D OUTPUT -p tcp -d 2606:50c0::/32 --dport 443 \
              -j REJECT --reject-with tcp-reset 2>/dev/null || true

            # ── Sauvegarde images pour rollback ──────────────────────────
            for service in backend ml-api airflow-webserver frontend; do
              CT=$(docker ps -q --filter "name=imf-${service}" 2>/dev/null | head -1)
              [ -n "$CT" ] && docker inspect --format='{{.Config.Image}}' "$CT" 2>/dev/null \
                > "$APP_DIR/.rollback_${service}_staging" || true
            done

            # ── Arrêt propre ──────────────────────────────────────────────
            $DC down --remove-orphans 2>/dev/null || true

            # ── Démarrage PostgreSQL + Redis d'abord ─────────────────────
            $DC up -d db redis
            echo "==> Attente DB healthy..."
            for i in $(seq 1 30); do
              STATUS=$(docker inspect imf-db --format '{{.State.Health.Status}}' 2>/dev/null || echo "missing")
              [ "$STATUS" = "healthy" ] && break
              echo "  DB status: $STATUS ($i/30)"
              sleep 3
            done

            # ── Init Airflow (premier déploiement uniquement) ─────────────
            FLAG="$APP_DIR/.airflow_initialized"
            if [ ! -f "$FLAG" ]; then
              echo "==> Init Airflow DB (premier déploiement)..."
              $DC --profile init run --rm airflow-init && touch "$FLAG"
              echo "==> Airflow init OK"
            else
              echo "==> Airflow déjà initialisé — skip"
            fi

            # ── Démarrage de la stack complète ───────────────────────────
            if ! $DC up -d --wait --wait-timeout 300 2>&1; then
              echo ""
              echo "==> ERREUR — état des conteneurs :"
              for ct in imf-backend imf-ml-api imf-airflow-webserver imf-airflow-scheduler imf-frontend imf-nginx; do
                echo "  $ct: $(docker inspect $ct \
                  --format 'status={{.State.Status}} exit={{.State.ExitCode}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}n/a{{end}}' \
                  2>/dev/null || echo 'not found')"
              done
              echo ""
              $DC logs backend --tail 60 2>&1 || true
              $DC logs ml-api  --tail 30 2>&1 || true
              exit 1
            fi
            echo "==> Deploy Staging OK : sha=${SHA}"

      - name: Health check public
        run: |
          for i in 1 2 3 4 5; do
            sleep 20
            if curl -fsS "${{ vars.STAGING_URL }}/health" 2>/dev/null; then
              echo ""
              echo "==> Health check OK (${{ vars.STAGING_URL }})"
              exit 0
            fi
            echo "Tentative $i/5 échouée..."
          done
          echo "Health check final échoué"
          exit 1

      - name: Rollback automatique
        if: failure() && steps.deploy.outcome == 'success'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key:      ${{ secrets.STAGING_SSH_KEY }}
          port:     ${{ secrets.STAGING_PORT }}
          script: |
            set -euo pipefail
            APP_DIR="/opt/imf-pipeline"
            DC="docker compose --env-file $APP_DIR/.env.staging -f $APP_DIR/deploy/docker-compose.staging.yml"

            echo "==> ROLLBACK Staging déclenché"
            $DC down --remove-orphans 2>/dev/null || true

            for service in backend ml-api airflow-webserver frontend; do
              ROLLBACK=$(cat "$APP_DIR/.rollback_${service}_staging" 2>/dev/null || echo "")
              if [ -n "$ROLLBACK" ]; then
                echo "==> Rollback $service → $ROLLBACK"
                docker pull "$ROLLBACK"
              fi
            done

            $DC up -d --wait --wait-timeout 120
            echo "==> Rollback Staging OK"

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 10 — Deploy Production  (manuel uniquement, confirmation 'DEPLOY')
  # ════════════════════════════════════════════════════════════════════════════
  deploy-production:
    name: "Deploy → Production"
    needs: [build-backend, build-ml-api, build-airflow, build-frontend]
    if: |
      github.event_name == 'workflow_dispatch'
      && github.event.inputs.deploy_env == 'production'
      && github.event.inputs.confirm_prod == 'DEPLOY'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Mask secrets
        run: |
          echo "::add-mask::${{ secrets.PROD_HOST }}"
          echo "::add-mask::${{ secrets.PROD_SSH_KEY }}"
          echo "::add-mask::${{ secrets.PROD_DB_PASSWORD }}"
          echo "::add-mask::${{ secrets.PROD_JWT_SECRET }}"
          echo "::add-mask::${{ secrets.PROD_AIRFLOW_FERNET_KEY }}"
          echo "::add-mask::${{ secrets.PROD_AIRFLOW_ADMIN_PASSWORD }}"

      - name: Short SHA
        run: echo "SHA_SHORT=$(printf '%.7s' '${{ github.sha }}')" >> $GITHUB_ENV

      - name: Deploy IMF Pipeline (production)
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USERNAME:          ${{ github.actor }}
          GHCR_READ_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
          GHCR_BASE:              ${{ env.REGISTRY }}/${{ github.repository }}
          SHA:                    ${{ env.SHA_SHORT }}
          DB_PASSWORD:            ${{ secrets.PROD_DB_PASSWORD }}
          JWT_SECRET:             ${{ secrets.PROD_JWT_SECRET }}
          AIRFLOW_FERNET_KEY:     ${{ secrets.PROD_AIRFLOW_FERNET_KEY }}
          AIRFLOW_ADMIN_PASSWORD: ${{ secrets.PROD_AIRFLOW_ADMIN_PASSWORD }}
        with:
          host:     ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key:      ${{ secrets.PROD_SSH_KEY }}
          envs:     GHCR_USERNAME,GHCR_READ_TOKEN,GHCR_BASE,SHA,DB_PASSWORD,JWT_SECRET,AIRFLOW_FERNET_KEY,AIRFLOW_ADMIN_PASSWORD
          command_timeout: 20m
          script: |
            set -euo pipefail
            APP_DIR="/opt/imf-pipeline"
            ENVFILE="$APP_DIR/.env.production"
            COMPOSE_FILE="$APP_DIR/deploy/docker-compose.staging.yml"
            DC="docker compose --env-file $ENVFILE -f $COMPOSE_FILE"

            REPO_URL="https://x-access-token:${GHCR_READ_TOKEN}@github.com/${{ github.repository }}.git"
            if [ -d "$APP_DIR/.git" ]; then
              cd "$APP_DIR"; chown -R root:root .git
              git remote set-url origin "$REPO_URL"
              git fetch origin main && git reset --hard origin/main
            else
              git clone "$REPO_URL" /tmp/imf-clone
              cp -a /tmp/imf-clone/. "$APP_DIR/"
              rm -rf /tmp/imf-clone
              cd "$APP_DIR"
            fi
            chmod +x "$APP_DIR/deploy/init-db.sh"

            cat > "$ENVFILE" << ENVEOF
            GHCR_BASE=${GHCR_BASE}
            VPS_IP=${{ secrets.PROD_HOST }}
            DB_USER=imf_user
            DB_PASSWORD=${DB_PASSWORD}
            DB_NAME=imf_db
            DB_AIRFLOW=airflow_db
            JWT_SECRET=${JWT_SECRET}
            AIRFLOW_FERNET_KEY=${AIRFLOW_FERNET_KEY}
            AIRFLOW_ADMIN_USER=admin
            AIRFLOW_ADMIN_PASSWORD=${AIRFLOW_ADMIN_PASSWORD}
            AIRFLOW_ADMIN_EMAIL=renekomtsindi7@gmail.com
            ENVEOF
            chmod 600 "$ENVFILE"

            printf '%s' "${GHCR_READ_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin

            ip6tables -I OUTPUT -p tcp -d 2606:50c0::/32 --dport 443 \
              -j REJECT --reject-with tcp-reset 2>/dev/null || true

            for service in backend ml-api airflow-webserver airflow-scheduler frontend; do
              PULL_OK=0
              for attempt in 1 2 3 4 5; do
                if $DC pull $service; then PULL_OK=1; break; fi
                sleep $((attempt * 5))
              done
              [ "$PULL_OK" -ne 1 ] && echo "ERROR: pull $service" && exit 1
            done

            ip6tables -D OUTPUT -p tcp -d 2606:50c0::/32 --dport 443 \
              -j REJECT --reject-with tcp-reset 2>/dev/null || true

            for service in backend ml-api airflow-webserver frontend; do
              CT=$(docker ps -q --filter "name=imf-${service}" 2>/dev/null | head -1)
              [ -n "$CT" ] && docker inspect --format='{{.Config.Image}}' "$CT" 2>/dev/null \
                > "$APP_DIR/.rollback_${service}_prod" || true
            done

            $DC down --remove-orphans 2>/dev/null || true
            $DC up -d db redis
            for i in $(seq 1 30); do
              STATUS=$(docker inspect imf-db --format '{{.State.Health.Status}}' 2>/dev/null || echo "missing")
              [ "$STATUS" = "healthy" ] && break
              sleep 3
            done

            FLAG="$APP_DIR/.airflow_initialized"
            if [ ! -f "$FLAG" ]; then
              $DC --profile init run --rm airflow-init && touch "$FLAG"
            fi

            $DC up -d --wait --wait-timeout 300
            echo "==> Deploy Production OK : sha=${SHA}"

      - name: Health check production
        run: |
          for i in 1 2 3 4 5; do
            sleep 20
            if curl -fsS "${{ vars.PRODUCTION_URL }}/health" 2>/dev/null; then
              echo "==> Production OK"
              exit 0
            fi
            echo "Tentative $i/5 échouée"
          done
          echo "Health check production échoué"
          exit 1

      - name: Rollback production
        if: failure() && steps.deploy.outcome == 'success'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key:      ${{ secrets.PROD_SSH_KEY }}
          script: |
            APP_DIR="/opt/imf-pipeline"
            DC="docker compose --env-file $APP_DIR/.env.production -f $APP_DIR/deploy/docker-compose.staging.yml"
            $DC down --remove-orphans 2>/dev/null || true
            for service in backend ml-api airflow-webserver frontend; do
              ROLLBACK=$(cat "$APP_DIR/.rollback_${service}_prod" 2>/dev/null || echo "")
              [ -n "$ROLLBACK" ] && docker pull "$ROLLBACK"
            done
            $DC up -d --wait --wait-timeout 120
            echo "==> Rollback Production OK"

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 11 — Résumé Pipeline  (toujours affiché)
  # ════════════════════════════════════════════════════════════════════════════
  summary:
    name: "Résumé Pipeline"
    needs:
      - backend-ci
      - pipeline-ci
      - frontend-ci
      - build-backend
      - build-ml-api
      - build-airflow
      - build-frontend
      - deploy-staging
      - deploy-production
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Rapport
        run: |
          echo "## CI/CD — IMF Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | CI | Build/Push | Deploy Staging | Deploy Prod |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|----|-----------|--------------|-----------| " >> $GITHUB_STEP_SUMMARY
          echo "| Backend (Spring Boot / Java 17) | ${{ needs.backend-ci.result }} | ${{ needs.build-backend.result }} | ${{ needs.deploy-staging.result }} | ${{ needs.deploy-production.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ML API (FastAPI / port 8090)    | ${{ needs.pipeline-ci.result }} | ${{ needs.build-ml-api.result }}  | ${{ needs.deploy-staging.result }} | ${{ needs.deploy-production.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Airflow + DAGs (port 9202)      | ${{ needs.pipeline-ci.result }} | ${{ needs.build-airflow.result }} | ${{ needs.deploy-staging.result }} | ${{ needs.deploy-production.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Angular (port 8091)    | ${{ needs.frontend-ci.result }} | ${{ needs.build-frontend.result }}| ${{ needs.deploy-staging.result }} | ${{ needs.deploy-production.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Branche | SHA |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| \`${{ github.ref_name }}\` | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
