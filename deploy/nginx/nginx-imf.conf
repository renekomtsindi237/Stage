# IMF Pipeline — Reverse Proxy Staging (port 9090)
# Routes : /api/ → backend:9200 | / → frontend:8091

upstream imf_backend  { server 127.0.0.1:9200; keepalive 16; }
upstream imf_frontend { server 127.0.0.1:8091; }

server {
    listen 9090;
    server_name _;
    client_max_body_size 10M;

    # Health check nginx (utilisé par le pipeline CI/CD)
    location = /health {
        access_log off;
        return 200 "IMF-OK\n";
        add_header Content-Type text/plain;
    }

    # API REST
    location /api/ {
        proxy_pass         http://imf_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # SSE — connexions long-polling
    location /api/sse/ {
        proxy_pass         http://imf_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection '';
        proxy_set_header   Host $host;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 86400s;
    }

    # Frontend (Angular SPA)
    location / {
        proxy_pass         http://imf_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host      $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
