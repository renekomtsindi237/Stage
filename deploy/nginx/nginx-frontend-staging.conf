# IMF Frontend — Angular SPA (port 9091)
# network_mode: host → écoute sur port 9091 (entrée publique frontend)
# API proxiée directement vers backend Spring Boot (host network, port 9200)
server {
    listen 9091;
    root  /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Health check (CI/CD)
    location = /health {
        access_log off;
        return 200 "IMF-WEB-OK\n";
        add_header Content-Type text/plain;
    }

    # Assets statiques — cache long terme
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — Angular Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE — connexions long-polling vers backend
    location /api/sse/ {
        proxy_pass         http://127.0.0.1:9200;
        proxy_http_version 1.1;
        proxy_set_header   Connection '';
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 86400s;
    }

    # Proxy API REST → backend Spring Boot (host network, port 9200)
    location /api/ {
        proxy_pass         http://127.0.0.1:9200;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Cloudflare termine le TLS → on retransmet le proto original au backend
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}
