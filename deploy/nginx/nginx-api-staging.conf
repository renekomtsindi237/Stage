# IMF Pipeline — API Gateway (port 9090)
# Backend + Pipeline uniquement — frontend servi séparément sur port 9091
# Routes : /api/ → backend:9200 | /model/ → ml-api:8090

upstream imf_backend { server 127.0.0.1:9200; keepalive 16; }
upstream imf_mlapi   { server 127.0.0.1:8090; keepalive 8; }

server {
    listen 9090;
    server_name _;
    client_max_body_size 10M;

    # Health check nginx (utilisé par le pipeline CI/CD)
    location = /health {
        access_log off;
        return 200 "IMF-API-OK\n";
        add_header Content-Type text/plain;
    }

    # SSE — connexions long-polling (scoring temps réel, notifications)
    location /api/sse/ {
        proxy_pass         http://imf_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection '';
        proxy_set_header   Host $host;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 86400s;
    }

    # API REST Spring Boot
    location /api/ {
        proxy_pass         http://imf_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # Swagger UI — Spring Boot (assets JS/CSS servis par springdoc)
    location /swagger-ui/ {
        proxy_pass         http://imf_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # OpenAPI spec JSON — Spring Boot
    location /api-docs {
        proxy_pass         http://imf_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # ML API FastAPI — /model/health, /score/, /model/docs, /model/openapi.json, /model/redoc
    # FastAPI sert docs à /model/docs et spec à /model/openapi.json — pas de réécriture de chemin
    location /model/ {
        proxy_pass         http://imf_mlapi;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # Scoring endpoints — sous /score/ (FastAPI)
    location /score/ {
        proxy_pass         http://imf_mlapi;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}
