# ══════════════════════════════════════════════════════════════════════════════
# IMF Pipeline — Stack Backend + Pipeline (Staging)
#
# Entry point API : http://VPS_IP:9090
#
# Ports hôte :
#   9090  → nginx-api (entrée publique API)
#   9200  → Spring Boot backend  (host network)
#   8090  → FastAPI ML API       (host network)
#   9202  → Airflow Webserver    (host network, accès direct admin)
#   5434  → PostgreSQL Airflow   (bridge, 127.0.0.1 uniquement)
#   6380  → Redis                (bridge, 127.0.0.1 uniquement)
#
# Base de données applicative → Supabase PostgreSQL géré (cloud)
#   Pooler : aws-0-eu-west-3.pooler.supabase.com:6543  (transaction mode, SSL)
#
# Frontend Angular → déployé séparément via docker-compose.frontend.yml (port 9091)
#
# Secrets injectés par GitHub Actions dans .env.staging (jamais en git) :
#   SUPABASE_DB_PASSWORD, SUPABASE_ANON_KEY
#   AIRFLOW_DB_PASSWORD, JWT_SECRET, AIRFLOW_FERNET_KEY, AIRFLOW_ADMIN_PASSWORD
# ══════════════════════════════════════════════════════════════════════════════

services:

  # ── PostgreSQL dédié Airflow (métadonnées Airflow uniquement) ───────────────
  airflow-db:
    image: postgres:16-alpine
    container_name: imf-airflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB:       airflow_db
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - airflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Redis 7 ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: imf-redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Airflow init — one-shot (profil "init") ──────────────────────────────────
  airflow-init:
    image: ${GHCR_BASE}/imf-airflow:staging
    container_name: imf-airflow-init
    restart: "no"
    profiles: [init]
    network_mode: host
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR:             LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@127.0.0.1:5434/airflow_db
      AIRFLOW__CORE__FERNET_KEY:           ${AIRFLOW_FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY:      ${JWT_SECRET}
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER:-admin}" \
          --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin --lastname IMF \
          --role Admin --email "${AIRFLOW_ADMIN_EMAIL:-admin@imf.local}" \
          2>/dev/null || echo "Utilisateur déjà existant — OK"
        echo "==> Airflow init terminé"

  # ── Backend Spring Boot (Java 17) ────────────────────────────────────────────
  backend:
    image: ${GHCR_BASE}/imf-backend:staging
    container_name: imf-backend
    restart: unless-stopped
    network_mode: host
    environment:
      SPRING_PROFILES_ACTIVE:        staging
      SERVER_PORT:                   "9200"
      SPRING_DATASOURCE_URL:         "jdbc:postgresql://aws-0-eu-west-3.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0"
      SPRING_DATASOURCE_USERNAME:    postgres.ceiqkvvacjsakycsgcfz
      SPRING_DATASOURCE_PASSWORD:    ${SUPABASE_DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      JWT_SECRET:                    ${JWT_SECRET}
      # CORS : domaine public Cloudflare + accès direct IP (debug/CI)
      CORS_ALLOWED_ORIGINS:          "https://imf.rene.it.com,http://${VPS_IP:-84.247.128.40}:9090,http://${VPS_IP:-84.247.128.40}:9091"
      REDIS_HOST:                    127.0.0.1
      REDIS_PORT:                    6380
      # backend et ml-api tournent tous deux en network_mode: host (pas de
      # réseau bridge Docker, donc pas de DNS "ml-api") — le défaut
      # http://ml-api:8090 de application.yml ne résout jamais ; getent
      # hosts ml-api confirmé en échec depuis imf-backend. MlScoringClient
      # (scoring temps réel à l'ouverture d'un dossier) échouait donc
      # silencieusement depuis le début, absorbé par son mode dégradé.
      ML_API_URL:                    http://localhost:8090
      # URL publique → liens OTP emails + cookies sécurisés
      APP_URL:                       "https://imf.rene.it.com"
      APP_NAME:                      "MicroRecouv"
      SUPABASE_URL:                  https://ceiqkvvacjsakycsgcfz.supabase.co
      SUPABASE_ANON_KEY:             ${SUPABASE_ANON_KEY}
      SMTP_HOST:                     ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT:                     ${SMTP_PORT:-587}
      SMTP_USER:                     ${SMTP_USER:-}
      SMTP_PASSWORD:                 ${SMTP_PASSWORD:-}
      GROQ_API_KEY:                  ${GROQ_API_KEY}
      FIREBASE_ENABLED:              "false"
      IMF_SWAGGER_SERVER_URL:        "https://imf.rene.it.com"
      # Partagée avec ml-api (X-Internal-Key sur /score/single, /score/batch)
      MCRS_INTERNAL_API_KEY:         ${MCRS_INTERNAL_API_KEY:-}
    volumes:
      - /ml/models:/ml/models:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --timeout=8 http://localhost:9200/actuator/health | grep -q UP || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 5

  # ── ML API FastAPI (scoring MCRS) ────────────────────────────────────────────
  ml-api:
    image: ${GHCR_BASE}/imf-ml-api:staging
    container_name: imf-ml-api
    restart: unless-stopped
    network_mode: host
    environment:
      DATABASE_URL: "postgresql://postgres.ceiqkvvacjsakycsgcfz:${SUPABASE_DB_PASSWORD}@aws-0-eu-west-3.pooler.supabase.com:6543/postgres?sslmode=require"
      MODEL_PATH:   /ml/models/mcrs/champion
      APP_ENV:      staging
      # Requise sur /score/single et /score/batch — vide = mode dégradé ouvert
      MCRS_INTERNAL_API_KEY: ${MCRS_INTERNAL_API_KEY:-}
    volumes:
      - /ml/models:/ml/models:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --max-time 8 http://localhost:8090/model/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5

  # ── Airflow Webserver (port 9202, accès direct admin) ────────────────────────
  airflow-webserver:
    image: ${GHCR_BASE}/imf-airflow:staging
    container_name: imf-airflow-webserver
    restart: unless-stopped
    network_mode: host
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR:             LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@127.0.0.1:5434/airflow_db
      AIRFLOW__CORE__FERNET_KEY:           ${AIRFLOW_FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY:      ${JWT_SECRET}
      AIRFLOW__WEBSERVER__WEB_SERVER_PORT: "9202"
      AIRFLOW__WEBSERVER__BASE_URL:        "http://${VPS_IP:-84.247.128.40}:9202"
      AIRFLOW__CORE__DAGS_FOLDER:          /opt/airflow/dags
      AIRFLOW__LOGGING__BASE_LOG_FOLDER:   /opt/airflow/logs
      # Les DAGs sont actifs dès leur découverte (pas de pause manuelle requise)
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      # Connexion vers la base applicative Supabase (utilisée par tous les DAGs via PostgresHook)
      AIRFLOW_CONN_IMF_PIPELINE_DB:        "postgresql://postgres.ceiqkvvacjsakycsgcfz:${SUPABASE_DB_PASSWORD}@aws-0-eu-west-3.pooler.supabase.com:6543/postgres?sslmode=require&options=-csearch_path%3Dapp"
      # dags/scripts/*.py font `from pipeline.src... import ...` : le paquet
      # pipeline/src n'était jusqu'ici jamais monté dans le conteneur, seul
      # pipeline/dags/ l'était — ModuleNotFoundError sur la quasi-totalité
      # des DAGs (dont dag_ml_training). Deux entrées nécessaires : /opt/airflow
      # (pour les imports en paquet `pipeline.src.xxx`) et
      # /opt/airflow/pipeline/src (pipeline/src/database.py fait lui-même des
      # imports plats `from config import settings`, pas `from .config`).
      PYTHONPATH:                          /opt/airflow:/opt/airflow/pipeline/src
      # dbt (feat_comportemental/feat_externe/assembler_feature_store dans
      # dag_ml_scoring) — profiles.yml lit ces variables via env_var(), pas
      # une seule n'était définie jusqu'ici (dbt échouait avant même de
      # tenter la connexion).
      DBT_PROJECT_DIR:                     /opt/airflow/pipeline/dbt_project
      DBT_PROFILES_DIR:                    /opt/airflow/pipeline/dbt_project
      DBT_TARGET:                          prod
      POSTGRES_HOST:                       aws-0-eu-west-3.pooler.supabase.com
      POSTGRES_PORT:                       "6543"
      POSTGRES_DB:                         postgres
      POSTGRES_USER:                       postgres.ceiqkvvacjsakycsgcfz
      POSTGRES_PASSWORD:                   ${SUPABASE_DB_PASSWORD}
    volumes:
      - /opt/imf-pipeline/pipeline/dags:/opt/airflow/dags:ro
      # pas :ro — dbt écrit package-lock.yml/dbt_packages/target/ dans
      # pipeline/dbt_project/ (aucune option dbt ne permet de les reloger
      # entièrement hors du project-dir en 1.8) ; confirmé par
      # `OSError: [Errno 30] Read-only file system` en testant `dbt deps`
      # avant ce correctif.
      - /opt/imf-pipeline/pipeline:/opt/airflow/pipeline
      # charger_modele_actif()/scorer_clients_batch() (dag_ml_scoring) lisent
      # le modèle champion sur disque — jamais monté ici jusqu'ici (seul
      # imf-ml-api l'avait), FileNotFoundError systématique sur cette tâche.
      - /ml/models:/ml/models:ro
      - airflow_logs:/opt/airflow/logs
    command: airflow webserver
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9202/health 2>/dev/null | python3 -c 'import sys,json; d=json.load(sys.stdin); sys.exit(0 if d[\"metadatabase\"][\"status\"]==\"healthy\" else 1)' || exit 1"]
      interval: 30s
      timeout: 15s
      start_period: 120s
      retries: 5

  # ── Airflow Scheduler ────────────────────────────────────────────────────────
  airflow-scheduler:
    image: ${GHCR_BASE}/imf-airflow:staging
    container_name: imf-airflow-scheduler
    restart: unless-stopped
    network_mode: host
    depends_on:
      airflow-webserver:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR:             LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@127.0.0.1:5434/airflow_db
      AIRFLOW__CORE__FERNET_KEY:           ${AIRFLOW_FERNET_KEY}
      AIRFLOW__CORE__DAGS_FOLDER:          /opt/airflow/dags
      AIRFLOW__LOGGING__BASE_LOG_FOLDER:   /opt/airflow/logs
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW_CONN_IMF_PIPELINE_DB:        "postgresql://postgres.ceiqkvvacjsakycsgcfz:${SUPABASE_DB_PASSWORD}@aws-0-eu-west-3.pooler.supabase.com:6543/postgres?sslmode=require&options=-csearch_path%3Dapp"
      # cf. commentaire équivalent sur airflow-webserver ci-dessus.
      PYTHONPATH:                          /opt/airflow:/opt/airflow/pipeline/src
      # cf. commentaires dbt sur airflow-webserver ci-dessus — c'est le
      # scheduler qui exécute réellement les tâches (LocalExecutor).
      DBT_PROJECT_DIR:                     /opt/airflow/pipeline/dbt_project
      DBT_PROFILES_DIR:                    /opt/airflow/pipeline/dbt_project
      DBT_TARGET:                          prod
      POSTGRES_HOST:                       aws-0-eu-west-3.pooler.supabase.com
      POSTGRES_PORT:                       "6543"
      POSTGRES_DB:                         postgres
      POSTGRES_USER:                       postgres.ceiqkvvacjsakycsgcfz
      POSTGRES_PASSWORD:                   ${SUPABASE_DB_PASSWORD}
      # dag_monitoring.py (alerting email) tourne sur ce service (LocalExecutor)
      # et n'avait jamais ces identifiants — SMTP_PASSWORD restait vide,
      # smtplib.login() aurait échoué à chaque incident détecté, sans jamais
      # envoyer la moindre alerte réelle.
      SMTP_HOST:                           ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT:                           ${SMTP_PORT:-587}
      SMTP_USER:                           ${SMTP_USER:-}
      SMTP_PASSWORD:                       ${SMTP_PASSWORD:-}
      ALERT_EMAIL:                         ${ALERT_EMAIL:-renekomtsindi7@gmail.com}
      # OpenWeatherMap (fetch_meteo_openweather, dag_donnees_externes) —
      # absente : no-op documenté, ne bloque jamais le DAG.
      OPENWEATHER_API_KEY:                 ${OPENWEATHER_API_KEY:-}
    volumes:
      - /opt/imf-pipeline/pipeline/dags:/opt/airflow/dags:ro
      - /opt/imf-pipeline/pipeline:/opt/airflow/pipeline
      # cf. commentaire équivalent sur airflow-webserver ci-dessus — c'est
      # le scheduler qui exécute réellement charger_modele_actif().
      - /ml/models:/ml/models:ro
      - airflow_logs:/opt/airflow/logs
    command: airflow scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob"]
      interval: 30s
      timeout: 15s
      start_period: 90s
      retries: 3

  # ── Nginx API Gateway (port 9090) ────────────────────────────────────────────
  nginx-api:
    image: nginx:1.27-alpine
    container_name: imf-nginx-api
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./nginx/nginx-api-staging.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  airflow_pgdata:
  airflow_logs:
