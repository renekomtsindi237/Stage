events {
    worker_connections 2048;
    multi_accept       on;
    use                epoll;
}

http {
    include           /etc/nginx/mime.types;
    default_type      application/octet-stream;
    sendfile          on;
    tcp_nopush        on;
    tcp_nodelay       on;
    keepalive_timeout 65;

    # Gzip
    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types      text/plain application/json application/javascript
                    text/css application/xml application/pdf;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_global:20m  rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m  rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream — Spring Boot (2 répliques)
    upstream api_backend {
        server springboot:8080 max_fails=3 fail_timeout=30s;
        keepalive 64;
    }

    # Redirect HTTP → HTTPS
    server {
        listen 80;
        server_name api.imf.cm www.imf.cm;
        return 301 https://$host$request_uri;
    }

    # HTTPS — API
    server {
        listen 443 ssl http2;
        server_name api.imf.cm;

        ssl_certificate     /etc/nginx/certs/imf.cm.crt;
        ssl_certificate_key /etc/nginx/certs/imf.cm.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # HSTS
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options           DENY                                  always;
        add_header X-Content-Type-Options    nosniff                               always;
        add_header X-XSS-Protection          "1; mode=block"                       always;
        add_header Referrer-Policy           "no-referrer-when-downgrade"          always;

        client_max_body_size 10m;
        limit_conn conn_limit 20;

        # Authentification — rate limit strict
        location /api/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass         http://api_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /api/v1/sse/ {
            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection '';
            proxy_set_header   Host $host;
            proxy_set_header   X-Accel-Buffering no;
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 86400s;
        }

        # API générale
        location /api/ {
            limit_req zone=api_global burst=60 nodelay;
            proxy_pass         http://api_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
            proxy_connect_timeout 15s;
            proxy_send_timeout 90s;
        }

        # Internal pipeline — restreint au réseau interne
        location /internal/ {
            allow  192.168.1.10;
            deny   all;
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
        }

        # Swagger — désactivé en production
        location /swagger-ui/ { return 404; }
        location /api-docs/   { return 404; }

        # Actuator — uniquement health sur port interne (8081)
        location /actuator/ { return 404; }
    }

    # HTTPS — Web App Angular
    server {
        listen 443 ssl http2;
        server_name www.imf.cm imf.cm;

        ssl_certificate     /etc/nginx/certs/imf.cm.crt;
        ssl_certificate_key /etc/nginx/certs/imf.cm.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options           DENY                                  always;
        add_header X-Content-Type-Options    nosniff                               always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" always;

        root  /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
            expires 1h;
            add_header Cache-Control "public, no-transform";
        }

        location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|ico)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
