events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain application/json application/javascript text/css;

    upstream api {
        server springboot:8080;
        keepalive 32;
    }

    # Limite de débit : 20 req/s par IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    server {
        listen 80;
        server_name _;

        client_max_body_size 10m;

        # Sécurité basique
        add_header X-Frame-Options        SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection       "1; mode=block";

        # API
        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass         http://api;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
            proxy_connect_timeout 15s;
            proxy_send_timeout 90s;
        }

        location /internal/ {
            # Accessible uniquement depuis le réseau Docker (pipeline server)
            allow 172.0.0.0/8;
            allow 192.168.0.0/16;
            deny  all;
            proxy_pass http://api;
            proxy_set_header Host $host;
        }

        location /swagger-ui/ { proxy_pass http://api; }
        location /api-docs/   { proxy_pass http://api; }

        # Actuator health uniquement
        location /actuator/health {
            proxy_pass http://api;
        }
        location /actuator/ { return 403; }

        # Angular SPA (static files copiés dans /usr/share/nginx/html)
        location / {
            root  /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
