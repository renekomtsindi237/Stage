events { worker_connections 512; }

http {
    upstream api {
        server backend:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # SSE — longue durée, sans buffering (doit précéder /api/)
        location /api/v1/sse/ {
            proxy_pass         http://api;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header   Connection '';
            proxy_set_header   X-Accel-Buffering no;
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 86400s;
            gzip off;
        }
        location /api/sse/ {
            proxy_pass         http://api;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header   Connection '';
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 86400s;
            gzip off;
        }

        # API Spring Boot
        location /api/ {
            proxy_pass         http://api;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /internal/ {
            proxy_pass http://api;
            proxy_set_header Host $host;
        }

        # Swagger UI
        location /swagger-ui/ {
            proxy_pass http://api;
        }
        location /api-docs/ {
            proxy_pass http://api;
        }

        # Actuator (dev uniquement — sans auth)
        location /actuator/ {
            proxy_pass http://api;
        }

        # Angular SPA (dev via conteneur web)
        location / {
            proxy_pass http://web:80;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
