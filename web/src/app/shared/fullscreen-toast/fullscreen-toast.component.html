<div class="fs-overlay" *ngIf="toast.show" [@overlayFade] (click)="toast.type === 'error' && close()">
  <div class="fs-card" [@cardPop] (click)="$event.stopPropagation()">

    <!-- ══ LOGOUT ══════════════════════════════════════════════ -->
    <ng-container *ngIf="toast.type === 'logout'">

      <div class="fs-icon-ring fs-ring-gold">
        <div class="fs-avatar-gold">
          <span *ngIf="toast.username">{{ toast.username.charAt(0).toUpperCase() }}</span>
          <mat-icon *ngIf="!toast.username">person</mat-icon>
        </div>
      </div>

      <mat-icon class="fs-wave">waving_hand</mat-icon>

      <h1 class="fs-title fs-title-gold">{{ toast.title }}</h1>
      <p class="fs-message">{{ toast.message }}</p>

      <div class="fs-progress-wrap">
        <div class="fs-progress fs-progress-gold"></div>
      </div>

    </ng-container>

    <!-- ══ SUCCÈS ══════════════════════════════════════════════ -->
    <ng-container *ngIf="toast.type === 'success'">

      <div class="fs-icon-ring fs-ring-success" [@iconBounce]>
        <mat-icon class="fs-icon-main">check_circle</mat-icon>
      </div>

      <h1 class="fs-title fs-title-success">{{ toast.title }}</h1>
      <p class="fs-message">{{ toast.message }}</p>

      <div class="fs-redirect">
        <mat-spinner diameter="22"></mat-spinner>
        <span>Redirection en cours…</span>
      </div>

      <div class="fs-progress-wrap">
        <div class="fs-progress fs-progress-success"></div>
      </div>

    </ng-container>

    <!-- ══ ERREUR ══════════════════════════════════════════════ -->
    <ng-container *ngIf="toast.type === 'error'">

      <div class="fs-icon-ring fs-ring-error" [@iconBounce]>
        <mat-icon class="fs-icon-main">error_outline</mat-icon>
      </div>

      <h1 class="fs-title fs-title-error">{{ toast.title }}</h1>
      <p class="fs-message">{{ toast.message }}</p>

      <button class="fs-close-btn" (click)="close()" type="button">
        <mat-icon>close</mat-icon>
        Fermer
      </button>

    </ng-container>

  </div>
</div>
