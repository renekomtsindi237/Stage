<div
  class="cd-overlay"
  *ngIf="dialog.show"
  [@fadeIn]
  (click)="onOverlayClick()"
>
  <div
    class="cd-dialog"
    [class.cd--warning]="dialog.type === 'warning'"
    [class.cd--danger]="dialog.type === 'danger'"
    [class.cd--info]="dialog.type === 'info'"
    [@slideIn]
    (click)="$event.stopPropagation()"
  >
    <!-- Bande header colorée -->
    <div class="cd-header">
      <div class="cd-icon-wrap">
        <mat-icon *ngIf="dialog.type === 'warning'" class="cd-icon">warning_amber</mat-icon>
        <mat-icon *ngIf="dialog.type === 'danger'" class="cd-icon">logout</mat-icon>
        <mat-icon *ngIf="dialog.type === 'info'" class="cd-icon">info</mat-icon>
      </div>
    </div>

    <!-- Corps -->
    <div class="cd-body">
      <h2 class="cd-title">{{ dialog.title }}</h2>
      <p class="cd-message">{{ dialog.message }}</p>

      <div class="cd-actions">
        <button class="cd-btn cd-btn--cancel" type="button" (click)="onCancel()">
          {{ dialog.cancelText }}
        </button>
        <button class="cd-btn cd-btn--confirm" type="button" (click)="onConfirm()">
          {{ dialog.confirmText }}
        </button>
      </div>
    </div>
  </div>
</div>
