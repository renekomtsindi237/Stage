<!-- Overlay -->
<div class="notif-overlay" @fadeOverlay (click)="close()"></div>

<!-- Panneau -->
<div class="notif-panel" @slideIn>

  <!-- En-tête -->
  <div class="notif-header">
    <div class="notif-header-left">
      <mat-icon class="notif-header-icon">notifications</mat-icon>
      <div>
        <h3 class="notif-title">Notifications</h3>
        <span class="notif-subtitle" *ngIf="unreadCount > 0">
          {{ unreadCount }} non lue{{ unreadCount > 1 ? 's' : '' }}
        </span>
        <span class="notif-subtitle" *ngIf="unreadCount === 0">
          Tout est à jour
        </span>
      </div>
    </div>
    <div class="notif-header-actions">
      <button mat-icon-button class="btn-read-all"
              *ngIf="unreadCount > 0"
              matTooltip="Tout marquer comme lu"
              (click)="markAllRead()">
        <mat-icon>done_all</mat-icon>
      </button>
      <button mat-icon-button class="btn-close" (click)="close()" matTooltip="Fermer">
        <mat-icon>close</mat-icon>
      </button>
    </div>
  </div>

  <!-- Liste -->
  <div class="notif-list" *ngIf="notifications.length > 0">
    <div class="notif-item"
         *ngFor="let n of notifications"
         [class.notif-unread]="!n.lu"
         (click)="markRead(n)">

      <div class="notif-icon-wrap" [style.background]="colorForType(n.type) + '18'">
        <mat-icon [style.color]="colorForType(n.type)">{{ iconForType(n.type) }}</mat-icon>
      </div>

      <div class="notif-body">
        <div class="notif-item-title">{{ n.titre }}</div>
        <div class="notif-item-msg">{{ n.message }}</div>
        <div class="notif-item-time">{{ timeAgo(n.createdAt) }}</div>
      </div>

      <div class="notif-unread-dot" *ngIf="!n.lu"></div>
    </div>
  </div>

  <!-- État vide -->
  <div class="notif-empty" *ngIf="notifications.length === 0">
    <mat-icon>notifications_none</mat-icon>
    <p>Aucune notification pour le moment</p>
    <span>Les alertes et événements apparaîtront ici en temps réel</span>
  </div>

</div>
