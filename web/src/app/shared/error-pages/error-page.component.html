<div class="ep-page">
  <!-- Grille décorative -->
  <div class="ep-grid" aria-hidden="true"></div>

  <!-- Logo MicroRecouv -->
  <a class="ep-logo" routerLink="/" tabindex="0">
    <img src="assets/MicroRecouv.png" alt="MicroRecouv" />
  </a>

  <!-- ── Offline variant ──────────────────────────────────── -->
  <ng-container *ngIf="config.isOffline">
    <div class="ep-offline-scene" @fadeUp>
      <div class="ep-offline-ring">
        <mat-icon class="ep-offline-icon-main">wifi_off</mat-icon>
        <div class="ep-offline-pulse"></div>
      </div>

      <div class="ep-offline-code">NET</div>

      <h1 class="ep-title">{{ config.title }}</h1>
      <p class="ep-message">{{ config.message }}</p>

      <div class="ep-actions">
        <button class="ep-btn ep-btn--primary" type="button" (click)="retry()">
          <mat-icon>refresh</mat-icon>
          Réessayer
        </button>
        <button class="ep-btn ep-btn--secondary" type="button" (click)="goHome()">
          <mat-icon>home</mat-icon>
          Accueil
        </button>
      </div>
    </div>
  </ng-container>

  <!-- ── TV rétro variant (404 / 403 / 500) ─────────────── -->
  <ng-container *ngIf="!config.isOffline">
    <div class="ep-scene" @fadeUp>

      <!-- Conteneur principal TV -->
      <div class="ep-main">

        <!-- Antenne -->
        <div class="ep-antenna">
          <div class="ep-antenna-shadow"></div>
          <div class="ep-a1"></div>
          <div class="ep-a1d"></div>
          <div class="ep-a2"></div>
          <div class="ep-a2d"></div>
          <div class="ep-a-base"></div>
        </div>

        <!-- Corps de la TV -->
        <div class="ep-tv">
          <!-- Courbe décorative coin -->
          <div class="ep-curve">
            <svg
              viewBox="0 0 189.929 189.929"
              xmlns="http://www.w3.org/2000/svg"
              class="ep-curve-svg"
            >
              <path
                d="M70.343,70.343c-30.554,30.553-44.806,72.7-39.102,115.635l-29.738,3.951
                   C-5.442,137.659,11.917,86.34,49.129,49.13C86.34,11.918,137.664-5.445,189.928,1.502
                   l-3.95,29.738C143.041,25.54,100.895,39.789,70.343,70.343z"
              />
            </svg>
          </div>

          <!-- Écran -->
          <div class="ep-display">
            <div class="ep-screen-out">
              <div class="ep-screen-out1">
                <div class="ep-screen">
                  <span class="ep-screen-text">{{ config.screenText }}</span>
                </div>
                <div class="ep-screen-m">
                  <span class="ep-screen-text">{{ config.screenText }}</span>
                </div>
              </div>
            </div>
          </div>

          <!-- Lignes décoratives -->
          <div class="ep-lines">
            <div class="ep-line1"></div>
            <div class="ep-line2"></div>
            <div class="ep-line3"></div>
          </div>

          <!-- Boutons + haut-parleurs -->
          <div class="ep-buttons">
            <div class="ep-b1"><div></div></div>
            <div class="ep-b2"></div>
            <div class="ep-speakers">
              <div class="ep-g1">
                <div class="ep-g11"></div>
                <div class="ep-g12"></div>
                <div class="ep-g13"></div>
              </div>
              <div class="ep-g"></div>
              <div class="ep-g"></div>
            </div>
          </div>
        </div>

        <!-- Socle -->
        <div class="ep-bottom">
          <div class="ep-base1"></div>
          <div class="ep-base2"></div>
          <div class="ep-base3"></div>
        </div>
      </div>

      <!-- Code d'erreur (digits) -->
      <div class="ep-code" @staggerDigits>
        <div
          *ngFor="let digit of codeDigits; let i = index"
          class="ep-digit"
          [class]="'ep-digit ep-digit-' + (i + 1)"
        >{{ digit }}</div>
      </div>

    </div>

    <!-- Texte explicatif + actions -->
    <div class="ep-info" @fadeUp>
      <h1 class="ep-title">{{ config.title }}</h1>
      <p class="ep-message">{{ config.message }}</p>

      <div class="ep-actions">
        <button class="ep-btn ep-btn--primary" type="button" (click)="goHome()">
          <mat-icon>home</mat-icon>
          Retour à l'accueil
        </button>
        <button class="ep-btn ep-btn--secondary" type="button" (click)="goBack()">
          <mat-icon>arrow_back</mat-icon>
          Page précédente
        </button>
      </div>
    </div>
  </ng-container>
</div>
