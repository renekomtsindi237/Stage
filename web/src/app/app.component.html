<!-- Splash screen au premier chargement -->
<app-splash *ngIf="showSplash" (done)="onSplashDone()"></app-splash>

<!-- Toast plein écran global -->
<app-fullscreen-toast></app-fullscreen-toast>

<!-- Dialog de confirmation global -->
<app-confirmation-dialog></app-confirmation-dialog>

<!-- Application principale -->
<ng-container *ngIf="!showSplash">

  <!-- Lueur interactive qui suit la souris en arrière-plan -->
  <div class="mouse-glow-bg"></div>

  <!-- Pages sans shell (landing, login) -->
  <ng-container *ngIf="isShellless">
    <router-outlet></router-outlet>
  </ng-container>

  <!-- Shell complet (sidebar + navbar) -->
  <ng-container *ngIf="!isShellless && auth.isLoggedIn()">
    <div class="app-shell">
      <imf-sidebar></imf-sidebar>
      <div class="app-content">
        <imf-navbar
          (toggleSidenav)="sidenavOpen = !sidenavOpen">
        </imf-navbar>
        <main class="app-main">
          <router-outlet></router-outlet>
        </main>
      </div>
    </div>
  </ng-container>

  <!-- Redirection si non authentifié sur une page protégée -->
  <ng-container *ngIf="!isShellless && !auth.isLoggedIn()">
    <router-outlet></router-outlet>
  </ng-container>

</ng-container>
