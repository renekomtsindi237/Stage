<div *ngIf="loading" class="loading-center">
  <mat-spinner diameter="40"></mat-spinner>
</div>
<mat-card *ngIf="error">
  <mat-card-content>
    <mat-icon color="warn">error_outline</mat-icon> {{ error }}
  </mat-card-content>
</mat-card>

<div *ngIf="client && !loading">
  <div class="detail-header">
    <button mat-icon-button routerLink="/admin/clients">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h2>{{ client.nomClient }}</h2>
  </div>

  <mat-card>
    <mat-card-header
      ><mat-card-title>Informations client</mat-card-title></mat-card-header
    >
    <mat-card-content>
      <dl class="info-list">
        <dt>Identifiant</dt>
        <dd>{{ client.idClient }}</dd>
        <dt>Téléphone</dt>
        <dd>{{ client.telephoneClient }}</dd>
        <dt>Agence</dt>
        <dd>{{ client.agencePrincipale }}</dd>
      </dl>
    </mat-card-content>
  </mat-card>
</div>
